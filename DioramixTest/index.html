      const isMobileDevice = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      const currentScene = getCurrentScene();
      if (!currentScene?.threeDElements) return;

      const loadingTextEl = document.getElementById('loadingText');
      const allElements = currentScene.threeDElements.filter(el => el.file && el.file.name);
      const totalFiles = allElements.length;
      let loadedFiles = 0;

      loaderSetCount('0 / ' + totalFiles);

      const isGSExt = (ext) => ext === 'sog' || ext === 'ply' || ext === 'spz';
      const getExt = (name) => name.toLowerCase().split('.').pop();

      let gsElements = allElements.filter(el => isGSExt(getExt(el.file.name)));
      const otherElements = allElements.filter(el => !isGSExt(getExt(el.file.name)));

      // ── Restore cached GS compound if returning to a visited scene ────────
      let gsRestored = false;
      const cachedGSScene = gsCompoundCache[currentSceneIndex];
      if (cachedGSScene && !cachedGSScene.compound.isDisposed() && Object.keys(cachedGSScene.parts || {}).length > 0) {
        cachedGSScene.compound.setEnabled(true);
        gsSceneCompound = cachedGSScene.compound;
        for (const [elementId, proxy] of Object.entries(cachedGSScene.parts)) {
          const el = gsElements.find(e => e.id === elementId);
          if (proxy) {
            if (el?.transform) {
              if (el.transform.position) proxy.position = new BABYLON.Vector3(...el.transform.position);
              if (el.transform.rotation) proxy.rotation = new BABYLON.Vector3(...el.transform.rotation);
              if (el.transform.scale) proxy.scaling = new BABYLON.Vector3(...el.transform.scale);
            }
            proxy.visibility = (el?.visible !== false) ? 1 : 0;
            loadedElementParts[elementId] = proxy;
            loadedElementMeshes[elementId] = [proxy];
          }
        }
        delete gsCompoundCache[currentSceneIndex];
        loadedFiles += gsElements.length;
        loaderSetCount(loadedFiles + ' / ' + totalFiles);
        gsElements = []; // skip Phase 1+2 — already in GPU
        gsRestored = true;
        console.log('[Scene] Restored GS compound from cache for scene', currentSceneIndex);
      }

      // ── Restore standalone GS meshes stashed by file name ────────────────
      // (fallback path used when compound addPart is unavailable or failed)
      if (gsElements.length > 0) {
        gsElements = gsElements.filter((el) => {
          const cachedStandalone = glbModelCache[el.file.name];
          if (!cachedStandalone) return true;
          cachedStandalone.meshes.forEach(m => m.setEnabled(el.visible !== false));
          loadedElementMeshes[el.id] = cachedStandalone.meshes;
          delete glbModelCache[el.file.name];
          loadedFiles++;
          loaderSetCount(loadedFiles + ' / ' + totalFiles);
          console.log('[Scene] Restored standalone GS from cache:', el.file.name);
          return false;
        });
      }

      // ── PHASE 1: Fetch GS files ──────────────────────────────────────────
      // Desktop: parallel fetch (faster). Mobile: sequential (42MB at a time
      // instead of 85MB+ simultaneously) to avoid iOS Safari OOM page kills.
      const gsBuffers = {};
      if (gsElements.length > 0) {
        if (loadingTextEl) loadingTextEl.textContent = 'Downloading...';

        const fileSizes = {};
        const fileReceived = {};
        let gsFilesDownloaded = 0;
        // GS download only fills its share of the bar so non-GS files (Phase 3)
        // can continue from there instead of the bar dropping back from 100%
        const gsShare = gsElements.length / totalFiles;
        const updateAggregateProgress = () => {
          const totalExpected = Object.values(fileSizes).reduce((a, b) => a + b, 0);
          const totalGot = Object.values(fileReceived).reduce((a, b) => a + b, 0);
          __loaderBytes.got = totalGot;
          __loaderBytes.total = totalExpected;
          if (totalExpected > 0) {
            loaderSetPct(Math.floor((totalGot / totalExpected) * 100 * gsShare));
          } else {
            // No Content-Length: fall back to file-count progress
            loaderSetPct(Math.floor((gsFilesDownloaded / gsElements.length) * 100 * gsShare));
          }
        };

        const fetchGSFileBuffer = async (el) => {
          const filePath = 'assets/' + el.file.name;
          const controller = new AbortController();
          const fetchTimeout = setTimeout(() => controller.abort(), 120000);
          try {
            const response = await fetch(filePath, { signal: controller.signal });
            if (!response.ok) throw new Error('Failed to fetch: ' + filePath);
            const contentLength = +response.headers.get('Content-Length') || 0;
            fileSizes[el.id] = contentLength;
            fileReceived[el.id] = 0;

            const reader = response.body.getReader();
            const chunks = [];
            let received = 0;
            while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              chunks.push(value);
              received += value.length;
              fileReceived[el.id] = received;
              updateAggregateProgress();
            }
            gsFilesDownloaded++;
            updateAggregateProgress();
            const fullBuffer = new Uint8Array(received);
            let pos = 0;
            for (const chunk of chunks) { fullBuffer.set(chunk, pos); pos += chunk.length; }
            return fullBuffer.buffer;
          } finally {
            clearTimeout(fetchTimeout);
          }
        };

        const fetchOneGSFile = async (el) => {
          // Mobile: no buffer cache — sequential fetch + free-after-parse keeps peak RAM low
          if (isMobileDevice) {
            gsBuffers[el.id] = await fetchGSFileBuffer(el);
            return;
          }
          const fileName = el.file.name;
          const cached = gsFileBufferCache[fileName];
          if (cached) {
            gsBuffers[el.id] = await cached;
            gsFilesDownloaded++;
            updateAggregateProgress();
            console.log('[Scene] Reusing downloaded GS file:', fileName);
            return;
          }
          const promise = fetchGSFileBuffer(el);
          gsFileBufferCache[fileName] = promise;
          try {
            gsBuffers[el.id] = await promise;
          } catch (e) {
            delete gsFileBufferCache[fileName];
            throw e;
          }
        };

        if (isMobileDevice) {
          for (const el of gsElements) { await fetchOneGSFile(el); }
        } else {
          await Promise.all(gsElements.map(fetchOneGSFile));
        }

        loaderSetPct(Math.floor(gsShare * 100));
      }

      // ── PHASE 2: Sequential GPU processing for GS elements ───────────────
      // Compound mesh (addPart) depth-sorts multiple splats together and is the only
      // path that survives scene switches via gsCompoundCache — so use it for ANY
      // number of GS elements (matches editor behavior, keeps models in GPU memory
      // when revisiting scenes). Requires keepInRam (extra RAM copy). On mobile, skip
      // compound to avoid OOM — use separate meshes instead (visibility still works).
      const useCompound = gsElements.length > 0 && !isMobileDevice;

      for (const element of gsElements) {
        const fileName = element.file.name;
        const fileExt = getExt(fileName);
        // SPZ uses .splat as the loader plugin extension
        const loaderExt = fileExt === 'spz' ? 'splat' : fileExt;

        if (loadingTextEl) loadingTextEl.textContent = 'Processing...';
        loaderSetCount(loadedFiles + ' / ' + totalFiles);

        try {
          const blob = new Blob([gsBuffers[element.id]], { type: 'application/octet-stream' });
          gsBuffers[element.id] = null; // Free raw download buffer immediately to reduce peak memory
          let result;

          if (useCompound && typeof BABYLON.ImportMeshAsync === 'function') {
            // Multi-GS compound path: new API with keepInRam for addPart support
            const file = new File([blob], element.id + '.' + loaderExt);
            result = await BABYLON.ImportMeshAsync(file, scene, { pluginOptions: { splat: { keepInRam: true } } });
          } else if (useCompound && BABYLON.SceneLoader.OnPluginActivatedObservable) {
            // Multi-GS compound path: Babylon.js 8.x keepInRam via observable
            let obs = BABYLON.SceneLoader.OnPluginActivatedObservable.add((loader) => {
              if (loader && typeof loader.keepInRam !== 'undefined') loader.keepInRam = true;
              if (obs) { BABYLON.SceneLoader.OnPluginActivatedObservable.remove(obs); obs = null; }
            });
            const url = URL.createObjectURL(blob);
            try {
              result = await BABYLON.SceneLoader.ImportMeshAsync('', '', url, scene, null, '.' + loaderExt);
            } finally {
              URL.revokeObjectURL(url);
              if (obs) { BABYLON.SceneLoader.OnPluginActivatedObservable.remove(obs); obs = null; }
            }
          } else {
            // Single GS path: keepInRam enables splatSize modification; skip on mobile to free RAM after GPU upload.
            const useKeepInRam = !isMobileDevice;
            if (typeof BABYLON.ImportMeshAsync === 'function') {
              const file = new File([blob], element.id + '.' + loaderExt);
              result = await BABYLON.ImportMeshAsync(file, scene, { pluginOptions: { splat: { keepInRam: useKeepInRam } } });
            } else {
              let obs = useKeepInRam && BABYLON.SceneLoader.OnPluginActivatedObservable
                ? BABYLON.SceneLoader.OnPluginActivatedObservable.add((loader) => {
                    if (loader && typeof loader.keepInRam !== 'undefined') loader.keepInRam = true;
                    if (obs) { BABYLON.SceneLoader.OnPluginActivatedObservable.remove(obs); obs = null; }
                  })
                : null;
              const url = URL.createObjectURL(blob);
              try {
                result = await BABYLON.SceneLoader.ImportMeshAsync('', '', url, scene, null, '.' + loaderExt);
              } finally {
                URL.revokeObjectURL(url);
                if (obs) { BABYLON.SceneLoader.OnPluginActivatedObservable.remove(obs); obs = null; }
              }
            }
          }

          if (result.meshes && result.meshes.length > 0) {
            // Pick the actual GS mesh (same as editor) — meshes[0] is not guaranteed to be it
            const importedMesh = result.meshes.find(m => m.getClassName && m.getClassName() === 'GaussianSplattingMesh') || result.meshes[0];
            let partCreated = false;

            if (useCompound) {
              try {
                if (BABYLON.GaussianSplattingMesh && typeof BABYLON.GaussianSplattingMesh === 'function') {
                  if (!gsSceneCompound || gsSceneCompound.isDisposed()) {
                    gsSceneCompound = new BABYLON.GaussianSplattingMesh('gs_scene_compound', null, scene, true);
                  }
                  if (typeof gsSceneCompound.addPart === 'function') {
                    // Bake Y-axis flip into GS vertex data before merging into compound.
                    // GS tools use Y-down; Babylon uses Y-up. Matches editor's approach.
                    importedMesh.scaling.y = -1;
                    if (typeof importedMesh.bakeTransformIntoVertices === 'function') {
                      importedMesh.bakeTransformIntoVertices(importedMesh.getWorldMatrix());
                      importedMesh.scaling.y = 1;
                    }
                    const proxy = gsSceneCompound.addPart(importedMesh, true);
                    if (proxy !== null && proxy !== undefined) {
                      proxy.name = element.id;
                      if (element.transform) {
                        if (element.transform.position) proxy.position = new BABYLON.Vector3(...element.transform.position);
                        if (element.transform.rotation) proxy.rotation = new BABYLON.Vector3(...element.transform.rotation);
                        if (element.transform.scale) proxy.scaling = new BABYLON.Vector3(...element.transform.scale);
                      }
                      if (gsSceneCompound.material && !gsMaterial) {
                        gsMaterial = gsSceneCompound.material;
                        setupCropVolumeOnBind(gsMaterial);
                      }
                      proxy.visibility = element.visible !== false ? 1 : 0;
                      loadedElementParts[element.id] = proxy;
                      loadedElementMeshes[element.id] = [proxy];
                      partCreated = true;
                    }
                  }
                }
              } catch (e) {
                console.warn('[GS] addPart failed, using fallback:', e);
              }
            }

            if (!partCreated) {
              loadedElementMeshes[element.id] = result.meshes;
              result.meshes.forEach((mesh) => {
                mesh.metadata = mesh.metadata || {};
                mesh.metadata.elementId = element.id;
                // Y-flip via scaling: GS tools export Y-down, Babylon is Y-up.
                const s = element.transform?.scale;
                mesh.scaling = new BABYLON.Vector3(s ? s[0] : 1, s ? -s[1] : -1, s ? s[2] : 1);
                if (element.transform?.position) mesh.position = new BABYLON.Vector3(...element.transform.position);
                if (element.transform?.rotation) mesh.rotation = new BABYLON.Vector3(...element.transform.rotation);
                if (mesh.material && !gsMaterial) {
                  gsMaterial = mesh.material;
                  setupCropVolumeOnBind(gsMaterial);
                }
                mesh.setEnabled(element.visible !== false);

                // Apply splatSize for single-element path (if keepInRam gave us splatsData)
                const splatSz = (element.gsSettings && element.gsSettings.splatSize != null) ? element.gsSettings.splatSize : 1.0;
                if (splatSz !== 1.0 && mesh.splatsData) {
                  try {
                    const singleBuf = mesh.splatsData;
                    const singleFloats = new Float32Array(singleBuf);
                    const singleCount = singleFloats.length / 8;
                    for (let si = 0; si < singleCount; si++) {
                      singleFloats[si * 8 + 3] *= splatSz;
                      singleFloats[si * 8 + 4] *= splatSz;
                      singleFloats[si * 8 + 5] *= splatSz;
                    }
                    mesh.updateData(singleBuf, mesh.shData || undefined, { flipY: false });
                  } catch (e) {
                    console.warn('[GS] splatSize application failed for single mesh:', e);
                  }
                }
              });
            }
          }

          loadedFiles++;
          const progressValue = Math.floor((loadedFiles / totalFiles) * 100);
          loaderSetPct(progressValue);
          loaderSetCount(loadedFiles + ' / ' + totalFiles);
          if (onProgress) onProgress(progressValue);
        } catch (error) {
          console.error('Failed to load GS model:', fileName, error);
          loadedFiles++;
        }
      }

      // ── Apply splatSize scaling for compound GS elements ─────────────────
      // Must run after all GS parts have been added to the compound via addPart().
      // Uses the same per-splat scale modification approach as the editor.
      if (gsSceneCompound && gsSceneCompound.splatsData) {
        try {
          const splatBuf = gsSceneCompound.splatsData;
          const splatFloats = new Float32Array(splatBuf);
          const totalSplats = splatFloats.length / 8;
          const splatPartIndices = gsSceneCompound.partIndices;
          let splatSizeModified = false;
          for (const el of gsElements) {
            const sz = (el.gsSettings && el.gsSettings.splatSize != null) ? el.gsSettings.splatSize : 1.0;
            if (sz === 1.0) continue;
            const proxyEl = loadedElementParts[el.id];
            if (!proxyEl || proxyEl.partIndex === undefined) continue;
            const pIdx = proxyEl.partIndex;
            for (let si = 0; si < totalSplats; si++) {
              const pi = splatPartIndices ? splatPartIndices[si] : 0;
              if (pi !== pIdx) continue;
              splatFloats[si * 8 + 3] *= sz;
              splatFloats[si * 8 + 4] *= sz;
              splatFloats[si * 8 + 5] *= sz;
            }
            splatSizeModified = true;
          }
          if (splatSizeModified) {
            gsSceneCompound.updateData(splatBuf, gsSceneCompound.shData || undefined, { flipY: false }, splatPartIndices || undefined);
          }
        } catch (e) {
          console.warn('[GS] splatSize application failed for compound:', e);
        }
      }

      if (loadingTextEl) loadingTextEl.textContent = 'Loading...';

      // ── PHASE 3: Non-GS elements (GLB, OBJ) — sequential ─────────────────
      for (const element of otherElements) {
        const fileName = element.file.name;

        // Check GLB cache first — reuse mesh if same file was loaded before
        if (glbModelCache[fileName]) {
          const cached = glbModelCache[fileName];
          cached.meshes.forEach(m => m.setEnabled(element.visible !== false));
          loadedElementMeshes[element.id] = cached.meshes;
          glbAnimationGroups[element.id] = cached.animationGroups || [];
          delete glbModelCache[fileName];
          loadedFiles++;
          loaderSetCount(loadedFiles + ' / ' + totalFiles);
          console.log('[Scene] Restored GLB from cache:', fileName);
          continue;
        }

        try {
          if (loadingTextEl) loadingTextEl.textContent = 'Downloading...';
          // Byte-level progress within this file's share of the bar — without this
          // the bar freezes for the whole download of large files (200MB+ OBJ)
          const expectedBytes = (element.fileSizeMB || 0) * 1048576;
          let dlPrevLoaded = 0;
          let dlTotalAdded = false;
          // rootUrl 'assets/' gives the OBJ plugin a base path so mtllib/map_* refs
          // load from assets/ (model URL itself is unchanged: 'assets/' + fileName)
          const result = await BABYLON.SceneLoader.ImportMeshAsync('', 'assets/', fileName, scene, (evt) => {
            const total = (evt.lengthComputable && evt.total > 0) ? evt.total : expectedBytes;
            if (total <= 0) return;
            if (!dlTotalAdded) { __loaderBytes.total += total; dlTotalAdded = true; }
            __loaderBytes.got += Math.max(0, Math.min(evt.loaded, total) - dlPrevLoaded);
            dlPrevLoaded = Math.min(evt.loaded, total);
            const frac = Math.min(evt.loaded / total, 1);
            loaderSetPct(Math.floor(((loadedFiles + frac) / totalFiles) * 100));
            if (frac >= 1 && loadingTextEl) loadingTextEl.textContent = 'Processing...';
          });
          if (loadingTextEl) loadingTextEl.textContent = 'Loading...';

          if (result.meshes && result.meshes.length > 0) {
            // MTL "Ns 0" (matte, common in photogrammetry OBJ exports) maps to
            // specularPower 0 = full white specular that washes out the texture.
            result.meshes.forEach((m) => {
              const mat = m.material;
              if (mat && 'specularPower' in mat && mat.specularPower === 0) {
                mat.specularColor = new BABYLON.Color3(0, 0, 0);
                mat.specularPower = 64;
              }
            });
            // Wrap all loaded meshes under a fresh root node before applying the
            // element transform. GLB gives a single __root__ parent, but OBJ loads
            // as independent sibling meshes — transforming meshes[0] alone leaves
            // the rest at origin. Mirrors the editor's rootMesh wrapper.
            const rootMesh = new BABYLON.Mesh(element.id + '_root', scene);
            result.meshes.forEach((m) => {
              if (!m.parent && m !== rootMesh) m.setParent(rootMesh);
            });
            loadedElementMeshes[element.id] = [rootMesh, ...result.meshes];
            [rootMesh, ...result.meshes].forEach((mesh) => {
              mesh.metadata = mesh.metadata || {};
              mesh.metadata.elementId = element.id;
            });
            rootMesh.setEnabled(element.visible !== false);
            if (element.transform) {
              if (element.transform.position) rootMesh.position = new BABYLON.Vector3(...element.transform.position);
              if (element.transform.rotation) {
                rootMesh.rotationQuaternion = null;
                rootMesh.rotation = new BABYLON.Vector3(...element.transform.rotation);
              }
              if (element.transform.scale) rootMesh.scaling = new BABYLON.Vector3(...element.transform.scale);
            }
            if (result.animationGroups && result.animationGroups.length > 0) {
              glbAnimationGroups[element.id] = result.animationGroups;
              result.animationGroups.forEach((ag) => ag.stop());
              const savedClip = element.activeAnimationClip;
              const savedMode = element.animationPlaybackMode;
              const savedFrame = element.animationStaticFrame;
              const savedLoopAll = element.animationLoopAll ?? false;
              if (savedMode === 'loop' && savedLoopAll && result.animationGroups.length > 1) {
                glbLoopAllActive[element.id] = true;
                const groups = result.animationGroups;
                const playAt = (idx) => {
                  if (!glbLoopAllActive[element.id]) return;
                  const ag = groups[idx % groups.length];
                  groups.forEach((g) => { if (g !== ag) g.stop(); });
                  ag.onAnimationGroupEndObservable.addOnce(() => playAt(idx + 1));
                  ag.start(false, 1.0);
                };
                playAt(0);
              } else if (savedClip && savedMode) {
                const ag = result.animationGroups.find((g) => g.name === savedClip);
                if (ag) {
                  if (savedMode === 'loop') ag.start(true, 1.0);
                  else if (savedMode === 'play-once') ag.start(false, 1.0);
                  else if (savedMode === 'static') {
                    const f = ag.from + (ag.to - ag.from) * (savedFrame ?? 0);
                    ag.start(false, 1.0); ag.goToFrame(f); ag.pause();
                  }
                }
              }
            }
          }

          loadedFiles++;
          const progressValue = Math.floor((loadedFiles / totalFiles) * 100);
          loaderSetPct(progressValue);
          loaderSetCount(loadedFiles + ' / ' + totalFiles);
          if (onProgress) onProgress(progressValue);
        } catch (error) {
          console.error('Failed to load model:', fileName, error);
          loadedFiles++;
        }
      }

    }

    // ---------- COLLISION PRIMITIVES ----------
    function createCollisionPrimitives() {
      const currentSceneData = getCurrentScene();
      collisionPrimitivesData = currentSceneData?.collisionPrimitives || [];

      // Clear existing collision meshes and reset step-through state
      collisionPrimitiveMeshes.forEach(mesh => mesh.dispose());
      collisionPrimitiveMeshes.clear();
      cropVolumeSnapshotIndex = {};

      // Register GLB collision meshes for this scene (meshes already loaded by loadModels)
      glbCollisionMeshMap.clear();
      glbCollisionDataArr = [];
      if (currentSceneData?.threeDElements) {
        currentSceneData.threeDElements.forEach((el) => {
          if (!el.collisionMeshEnabled) return;
          const meshes = loadedElementMeshes[el.id];
          if (!meshes || meshes.length === 0) return;
          const subMeshes = meshes.filter(m => m.getTotalVertices && m.getTotalVertices() > 0);
          subMeshes.forEach((mesh, j) => {
            mesh.isVisible = false;
            const syntheticId = el.id + '_glbcol_' + j;
            glbCollisionMeshMap.set(syntheticId, mesh);
            glbCollisionDataArr.push({
              id: syntheticId,
              margin: el.collisionMeshMargin ?? 0.2,
              collisionMode: el.collisionMeshMode ?? 'exterior',
            });
          });
        });
      }
      
      for (const primitive of collisionPrimitivesData) {
        if (!primitive.visible) continue;
        
        let mesh;
        switch (primitive.type) {
          case 'Cube':
            mesh = BABYLON.MeshBuilder.CreateBox(primitive.id, { size: 1 }, scene);
            break;
          case 'Sphere':
            mesh = BABYLON.MeshBuilder.CreateSphere(primitive.id, { diameter: 1, segments: 16 }, scene);
            break;
          case 'Plane':
            mesh = BABYLON.MeshBuilder.CreatePlane(primitive.id, { size: 1 }, scene);
            break;
          default:
            continue;
        }
        
        // Apply transform
        if (primitive.transform) {
          mesh.position = new BABYLON.Vector3(...primitive.transform.position);
          mesh.rotation = new BABYLON.Vector3(...primitive.transform.rotation);
          mesh.scaling = new BABYLON.Vector3(...primitive.transform.scale);
        }
        
        // Make invisible but keep for collision
        mesh.isVisible = false;
        mesh.checkCollisions = true;
        mesh.isPickable = false;
        
        collisionPrimitiveMeshes.set(primitive.id, mesh);
      }
    }
    
    // Collision detection function
    function checkCameraCollision() {
      if (!camera || isAnimating || (collisionPrimitiveMeshes.size === 0 && glbCollisionMeshMap.size === 0)) return;
      
      const cameraPos = camera.position;
      
      for (const [primitiveId, mesh] of collisionPrimitiveMeshes) {
        const primitive = collisionPrimitivesData.find(p => p.id === primitiveId);
        if (!primitive) continue;
        
        const margin = primitive.margin ?? 0.2;
        const collisionMode = primitive.collisionMode ?? 'exterior';
        
        // Ray directions for collision - include diagonals for more accurate detection
        const directions = [
          new BABYLON.Vector3(1, 0, 0),
          new BABYLON.Vector3(-1, 0, 0),
          new BABYLON.Vector3(0, 1, 0),
          new BABYLON.Vector3(0, -1, 0),
          new BABYLON.Vector3(0, 0, 1),
          new BABYLON.Vector3(0, 0, -1),
          // Diagonals
          new BABYLON.Vector3(1, 1, 0).normalize(),
          new BABYLON.Vector3(-1, 1, 0).normalize(),
          new BABYLON.Vector3(1, -1, 0).normalize(),
          new BABYLON.Vector3(-1, -1, 0).normalize(),
          new BABYLON.Vector3(0, 1, 1).normalize(),
          new BABYLON.Vector3(0, -1, 1).normalize(),
          new BABYLON.Vector3(0, 1, -1).normalize(),
          new BABYLON.Vector3(0, -1, -1).normalize(),
        ];
        
        // Check if camera is inside the primitive
        const isInsidePrimitive = () => {
          let insideCount = 0;
          const minInsideDistance = margin + 0.1;
          
          for (const dir of [new BABYLON.Vector3(1, 0, 0), new BABYLON.Vector3(0, 1, 0), new BABYLON.Vector3(0, 0, 1)]) {
            const ray = new BABYLON.Ray(cameraPos, dir, 1000);
            const hits = ray.intersectsMesh(mesh);
            if (hits.hit && hits.pickedPoint) {
              const distanceForward = BABYLON.Vector3.Distance(cameraPos, hits.pickedPoint);
              const rayBack = new BABYLON.Ray(cameraPos, dir.scale(-1), 1000);
              const hitsBack = rayBack.intersectsMesh(mesh);
              if (hitsBack.hit && hitsBack.pickedPoint) {
                const distanceBackward = BABYLON.Vector3.Distance(cameraPos, hitsBack.pickedPoint);
                if (distanceForward > minInsideDistance && distanceBackward > minInsideDistance) {
                  insideCount++;
                }
              }
            }
          }
          return insideCount >= 2;
        };
        
        const cameraIsInside = isInsidePrimitive();
        
        // Exterior mode: push away when too close
        if ((collisionMode === 'exterior' || collisionMode === 'both') && !cameraIsInside) {
          for (const dir of directions) {
            const ray = new BABYLON.Ray(cameraPos, dir, margin + 0.5);
            const hit = ray.intersectsMesh(mesh);
            if (hit.hit && hit.pickedPoint) {
              const distance = BABYLON.Vector3.Distance(cameraPos, hit.pickedPoint);
              if (distance < margin) {
                const pushAmount = margin - distance + 0.02;
                const pushDirection = dir.scale(-pushAmount);
                camera.position = camera.position.add(pushDirection);
              }
            }
          }
        }
        
        // Interior mode: keep camera inside
        if ((collisionMode === 'interior' || collisionMode === 'both') && cameraIsInside) {
          for (const dir of directions) {
            const ray = new BABYLON.Ray(cameraPos, dir, margin + 0.5);
            const hit = ray.intersectsMesh(mesh);
            if (hit.hit && hit.pickedPoint) {
              const distance = BABYLON.Vector3.Distance(cameraPos, hit.pickedPoint);
              if (distance < margin) {
                const pushAmount = margin - distance + 0.02;
                const pushDirection = dir.scale(-pushAmount);
                camera.position = camera.position.add(pushDirection);
              }
            }
          }
        }
      }

      // GLB collision meshes check
      const glbDirections = [
        new BABYLON.Vector3(1, 0, 0), new BABYLON.Vector3(-1, 0, 0),
        new BABYLON.Vector3(0, 1, 0), new BABYLON.Vector3(0, -1, 0),
        new BABYLON.Vector3(0, 0, 1), new BABYLON.Vector3(0, 0, -1),
        new BABYLON.Vector3(1, 1, 0).normalize(), new BABYLON.Vector3(-1, 1, 0).normalize(),
        new BABYLON.Vector3(1, -1, 0).normalize(), new BABYLON.Vector3(-1, -1, 0).normalize(),
        new BABYLON.Vector3(0, 1, 1).normalize(), new BABYLON.Vector3(0, -1, 1).normalize(),
        new BABYLON.Vector3(0, 1, -1).normalize(), new BABYLON.Vector3(0, -1, -1).normalize(),
      ];

      for (const [syntheticId, mesh] of glbCollisionMeshMap) {
        const data = glbCollisionDataArr.find(d => d.id === syntheticId);
        if (!data) continue;
        const margin = data.margin ?? 0.2;
        const collisionMode = data.collisionMode ?? 'exterior';

        const isInsideGlbMesh = () => {
          let insideCount = 0;
          const minInsideDistance = margin + 0.1;
          for (const dir of [new BABYLON.Vector3(1,0,0), new BABYLON.Vector3(0,1,0), new BABYLON.Vector3(0,0,1)]) {
            const ray = new BABYLON.Ray(cameraPos, dir, 1000);
            const hits = ray.intersectsMesh(mesh);
            if (hits.hit && hits.pickedPoint) {
              const distFwd = BABYLON.Vector3.Distance(cameraPos, hits.pickedPoint);
              const rayBack = new BABYLON.Ray(cameraPos, dir.scale(-1), 1000);
              const hitsBack = rayBack.intersectsMesh(mesh);
              if (hitsBack.hit && hitsBack.pickedPoint) {
                const distBck = BABYLON.Vector3.Distance(cameraPos, hitsBack.pickedPoint);
                if (distFwd > minInsideDistance && distBck > minInsideDistance) insideCount++;
              }
            }
          }
          return insideCount >= 2;
        };

        const cameraIsInsideGlb = isInsideGlbMesh();

        if ((collisionMode === 'exterior' || collisionMode === 'both') && !cameraIsInsideGlb) {
          for (const dir of glbDirections) {
            const ray = new BABYLON.Ray(cameraPos, dir, margin + 0.5);
            const hit = ray.intersectsMesh(mesh);
            if (hit.hit && hit.pickedPoint) {
              const distance = BABYLON.Vector3.Distance(cameraPos, hit.pickedPoint);
              if (distance < margin) {
                const pushAmount = margin - distance + 0.02;
                camera.position = camera.position.add(dir.scale(-pushAmount));
              }
            }
          }
        }

        if ((collisionMode === 'interior' || collisionMode === 'both') && cameraIsInsideGlb) {
          for (const dir of glbDirections) {
            const ray = new BABYLON.Ray(cameraPos, dir, margin + 0.5);
            const hit = ray.intersectsMesh(mesh);
            if (hit.hit && hit.pickedPoint) {
              const distance = BABYLON.Vector3.Distance(cameraPos, hit.pickedPoint);
              if (distance < margin) {
                const pushAmount = margin - distance + 0.02;
                camera.position = camera.position.add(dir.scale(-pushAmount));
              }
            }
          }
        }
      }
    }

    // WASD movement handler
    function handleWASDMovement() {
      if (!camera || !wasdEnabled || isAnimating) return;
      
      const speed = 0.05 * (typeof vcSavedFpv !== 'undefined' ? vcSavedFpv : 1);
      
      // Use FPV camera if it's active (look-around mode)
      const activeCamera = (fpvCamera && scene && scene.activeCamera === fpvCamera) ? fpvCamera : camera;
      
      const forward = activeCamera.getForwardRay().direction.normalize();
      const right = BABYLON.Vector3.Cross(BABYLON.Axis.Y, forward).normalize();
      
      let movement = BABYLON.Vector3.Zero();
      
      if (keysPressed['w'] || keysPressed['W']) movement = movement.add(forward.scale(speed));
      if (keysPressed['s'] || keysPressed['S']) movement = movement.add(forward.scale(-speed));
      if (keysPressed['a'] || keysPressed['A']) movement = movement.add(right.scale(-speed));
      if (keysPressed['d'] || keysPressed['D']) movement = movement.add(right.scale(speed));
      if (keysPressed['q'] || keysPressed['Q']) movement.y -= speed;
      if (keysPressed['e'] || keysPressed['E']) movement.y += speed;
      
      if (movement.length() > 0) {
        activeCamera.position = activeCamera.position.add(movement);
        // Also move orbit camera target to keep in sync
        if (activeCamera === fpvCamera) {
          camera.position = activeCamera.position.clone();
          camera.target = camera.target.add(movement);
        } else {
          camera.target = camera.target.add(movement);
        }
      }
    }

    // ---------- CLIPPING PLANE ----------
    function initClippingPlane() {
      clippingPlane = new BABYLON.Plane(0, 0, 1, 0);
      scene.clipPlane = null;
    }
    
    function updateClippingPlane(clipValue) {
      if (!clippingPlane || !camera) return;
      
      if (clipValue <= 0.001) {
        scene.clipPlane = null;
        return;
      }
      
      // Calculate clipping plane facing camera - same logic as preview mode
      const clipDistance = clipValue * camera.radius;
      const cameraDirection = camera.getForwardRay().direction.normalize();
      const clipPlanePosition = camera.position.add(cameraDirection.scale(clipDistance));
      const clipNormal = cameraDirection.scale(-1);
      const d = -BABYLON.Vector3.Dot(clipNormal, clipPlanePosition);
      
      clippingPlane = new BABYLON.Plane(clipNormal.x, clipNormal.y, clipNormal.z, d);
      scene.clipPlane = clippingPlane;
    }

    // ---------- PRESENTATION START OVERLAY (FADE-IN) ----------
    function playPresentationFadeIn() {
      const settings = projectData.presentationStart;
      if (!settings || settings.mode === 'direct') return;
      
      const overlay = document.getElementById('presentationOverlay');
      if (!overlay) return;
      
      const fadeColor = settings.fadeColor || '#000000';
      const fadeDuration = (settings.fadeDuration || 1.5) * 1000;
      
      overlay.style.backgroundColor = fadeColor;
      overlay.style.opacity = '1';
      
      const startTime = performance.now();
      
      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / fadeDuration, 1);
        const eased = 1 - Math.pow(1 - progress, 2); // Ease out
        
        overlay.style.opacity = String(1 - eased);
        
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          overlay.style.opacity = '0';
        }
      }
      
      // Small delay to ensure first frame renders
      setTimeout(() => requestAnimationFrame(animate), 50);
    }

    // ---------- ENVIRONMENT BACKGROUND ----------
    var currentPhotoDome = null;
    var currentHdrSkybox = null;
    
    function disposeEnvironmentBackground() {
      if (currentPhotoDome) {
        currentPhotoDome.dispose();
        currentPhotoDome = null;
      }
      if (currentHdrSkybox) {
        currentHdrSkybox.dispose();
        currentHdrSkybox = null;
      }
      if (scene.environmentTexture) {
        scene.environmentTexture.dispose();
        scene.environmentTexture = null;
      }
    }

    function buildGradientCanvas(stops, gradType, gradAngle) {
      var W = 2048, H = 1024;
      var canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      var ctx = canvas.getContext('2d');
      var sorted = stops.slice().sort(function(a, b) { return a.position - b.position; });
      var gradient;
      if (gradType === 'radial') {
        gradient = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.min(W, H)/2);
      } else {
        var rad = ((gradAngle - 90) * Math.PI) / 180;
        var dx = Math.cos(rad), dy = Math.sin(rad);
        gradient = ctx.createLinearGradient(W/2 - dx*W/2, H/2 - dy*H/2, W/2 + dx*W/2, H/2 + dy*H/2);
      }
      for (var i = 0; i < sorted.length; i++) {
        gradient.addColorStop(sorted[i].position / 100, sorted[i].color);
      }
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);
      return canvas.toDataURL('image/png');
    }

    function applySceneEnvironmentBackground() {
      const currentScene = getCurrentScene();
      const envBg = currentScene?.environmentBackground;
      
      // Helper to convert hex to RGB (0-1 range)
      function hexToRgbNormalized(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
          r: parseInt(result[1], 16) / 255,
          g: parseInt(result[2], 16) / 255,
          b: parseInt(result[3], 16) / 255
        } : { r: 0.1, g: 0.1, b: 0.12 };
      }
      
      // Always dispose previous environment first
      disposeEnvironmentBackground();
      
      if (!envBg || !envBg.enabled) {
        // Default dark background when environment is disabled
        scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.12, 1);
        return;
      }
      
      // Derive effective background mode (backward-compatible with old scenes)
      var effectiveMode = envBg.backgroundMode ?? (envBg.image ? 'image' : 'color');

      if (effectiveMode === 'gradient') {
        scene.clearColor = new BABYLON.Color4(0, 0, 0, 1);
        var gradStops = envBg.gradientStops || [];
        if (gradStops.length < 2) return;
        var gradDataUrl = buildGradientCanvas(gradStops, envBg.gradientType || 'linear', envBg.gradientAngle != null ? envBg.gradientAngle : 180);
        var gradEnvSize = envBg.size || 1000;
        var gradEnvRotation = envBg.rotation || 0;
        var gradEnvBrightness = envBg.brightness != null ? envBg.brightness : 1;
        try {
          var GradDomeClass = BABYLON.PhotoDome || BABYLON.TextureDome;
          if (!GradDomeClass) { console.error('PhotoDome not available for gradient'); return; }
          var gradDome = new GradDomeClass("photoDome", gradDataUrl, { resolution: 32, size: gradEnvSize, useDirectMapping: true, faceForward: false }, scene);
          gradDome.rotationQuaternion = null;
          gradDome.rotation.y = (gradEnvRotation * Math.PI) / 180;
          function applyGradDomeSettings() {
            try { if (gradDome.photoTexture) gradDome.photoTexture.level = gradEnvBrightness; } catch(e) {}
          }
          applyGradDomeSettings();
          if (gradDome.photoTexture && gradDome.photoTexture.onLoadObservable) {
            gradDome.photoTexture.onLoadObservable.addOnce(applyGradDomeSettings);
          }
          setTimeout(applyGradDomeSettings, 500);
          currentPhotoDome = gradDome;
        } catch(err) { console.error('Gradient dome failed:', err); }
        return;
      }

      if (effectiveMode === 'color') {
        const rgbC = hexToRgbNormalized(envBg.color || '#000000');
        scene.clearColor = new BABYLON.Color4(rgbC.r, rgbC.g, rgbC.b, 1);
        return;
      }

      // effectiveMode === 'image'
      const rgb = hexToRgbNormalized(envBg.color || '#000000');
      scene.clearColor = new BABYLON.Color4(rgb.r, rgb.g, rgb.b, 1);

      if (envBg.image) {
        const envSize = envBg.size || 1000;
        const envRotation = envBg.rotation || 0;
        const envBrightness = envBg.brightness != null ? envBg.brightness : 1;
        const envOpacity = 1;
        const isHDR = envBg.image.includes(';hdr;base64,');
        
        if (isHDR) {
          // HDR environment using RawCubeTexture + skybox mesh
          try {
            var base64Data = envBg.image.split(';base64,')[1];
            var binaryString = atob(base64Data);
            var bytes = new Uint8Array(binaryString.length);
            for (var i = 0; i < binaryString.length; i++) {
              bytes[i] = binaryString.charCodeAt(i);
            }
            
            // Parse RGBE/HDR format
            var dataView = new DataView(bytes.buffer);
            var headerEnd = 0;
            for (var idx = 0; idx < bytes.length - 1; idx++) {
              if (bytes[idx] === 10 && bytes[idx + 1] === 10) {
                headerEnd = idx + 2;
                break;
              }
            }
            
            // Find dimensions
            var dimLine = '';
            for (var idx2 = headerEnd; idx2 < bytes.length; idx2++) {
              if (bytes[idx2] === 10) break;
              dimLine += String.fromCharCode(bytes[idx2]);
            }
            var dimMatch = dimLine.match(/-Y\s+(\d+)\s+\+X\s+(\d+)/);
            var hdrWidth = dimMatch ? parseInt(dimMatch[2]) : 256;
            var hdrHeight = dimMatch ? parseInt(dimMatch[1]) : 256;
            
            // Create a simple cube texture from the HDR data
            var faceSize = 128;
            var faceData = new Uint8Array(faceSize * faceSize * 4);
            for (var fi = 0; fi < faceData.length; fi += 4) {
              faceData[fi] = 128;
              faceData[fi + 1] = 128;
              faceData[fi + 2] = 128;
              faceData[fi + 3] = 255;
            }
            
            var hdrTexture = new BABYLON.RawCubeTexture(
              scene, 
              [faceData, faceData, faceData, faceData, faceData, faceData],
              faceSize,
              BABYLON.Constants.TEXTUREFORMAT_RGBA,
              BABYLON.Constants.TEXTURETYPE_UNSIGNED_BYTE,
              false
            );
            
            var skybox = BABYLON.MeshBuilder.CreateBox("hdrSkybox", { size: envSize }, scene);
            skybox.infiniteDistance = true;
            
            var skyboxMaterial = new BABYLON.BackgroundMaterial("hdrSkyboxMaterial", scene);
            skyboxMaterial.reflectionTexture = hdrTexture;
            skyboxMaterial.reflectionTexture.coordinatesMode = BABYLON.Texture.SKYBOX_MODE;
            skyboxMaterial.enableGroundProjection = false;
            skyboxMaterial.primaryColor = new BABYLON.Color3(envBrightness, envBrightness, envBrightness);
            skyboxMaterial.alpha = envOpacity;
            
            skybox.material = skyboxMaterial;
            skybox.rotation.y = (envRotation * Math.PI) / 180;
            
            currentHdrSkybox = skybox;
            scene.environmentTexture = hdrTexture;
          } catch (err) {
            console.error('Failed to create HDR environment:', err);
          }
        } else {
          // Regular image using PhotoDome
          try {
            var PhotoDomeClass = BABYLON.PhotoDome || BABYLON.TextureDome;
            if (!PhotoDomeClass) {
              console.error('PhotoDome not available in this Babylon.js build');
              return;
            }
            var photoDome = new PhotoDomeClass(
              "photoDome",
              envBg.image,
              {
                resolution: 32,
                size: envSize,
                useDirectMapping: true,
                faceForward: false,
              },
              scene
            );
            
            photoDome.rotationQuaternion = null;
            photoDome.rotation.y = (envRotation * Math.PI) / 180;
            
            // Apply brightness/opacity immediately and also after texture loads
            function applyPhotoDomeSettings() {
              try {
                if (photoDome.photoTexture) {
                  photoDome.photoTexture.level = envBrightness;
                }
                if (photoDome.mesh && photoDome.mesh.material) {
                  photoDome.mesh.material.alpha = envOpacity;
                }
              } catch(e) { console.warn('PhotoDome settings error:', e); }
            }
            
            applyPhotoDomeSettings();
            
            // Also apply after texture is fully loaded
            if (photoDome.onReady) {
              photoDome.onReady = applyPhotoDomeSettings;
            } else if (photoDome.photoTexture && photoDome.photoTexture.onLoadObservable) {
              photoDome.photoTexture.onLoadObservable.addOnce(applyPhotoDomeSettings);
            }
            // Fallback: retry after a short delay
            setTimeout(applyPhotoDomeSettings, 500);
            setTimeout(applyPhotoDomeSettings, 2000);
            
            currentPhotoDome = photoDome;
            console.log('PhotoDome created successfully, size:', envSize);
          } catch (err) {
            console.error('Failed to create PhotoDome environment:', err);
          }
        }
      }
    }

    // ---------- BACKGROUND SOUND ----------
    // Starts/stops the current scene's ambient "Background Sound". Runs on its own
    // controller instance (backgroundSoundController) so it keeps playing underneath
    // any button-triggered "Play Sound" actions instead of being cut off by them.
    // Called as soon as a scene becomes current (before its models load): always stops/fades
    // whatever was playing for the previous scene right away, and starts the new scene's sound
    // immediately too — UNLESS that scene's "Wait until scene is fully loaded" option is on, in
    // which case the actual playback start is deferred to startSceneBackgroundSoundIfWaiting().
    function applySceneBackgroundSound() {
      const currentScene = getCurrentScene();
      const bg = currentScene?.backgroundSound;
      if (bg && bg.enabled && bg.soundFileName) {
        if (bg.waitForLoad) {
          backgroundSoundController.interruptForNavigation();
        } else {
          backgroundSoundController.play({
            src: 'assets/' + bg.soundFileName,
            loop: bg.loop !== false,
            interruptBehavior: 'fade',
            interruptFadeDuration: 1,
          });
        }
      } else {
        backgroundSoundController.interruptForNavigation();
      }
    }

    // Companion to applySceneBackgroundSound(): call once the scene's loading has actually
    // finished, for scenes whose background sound is set to wait for that.
    function startSceneBackgroundSoundIfWaiting() {
      const currentScene = getCurrentScene();
      const bg = currentScene?.backgroundSound;
      if (bg && bg.enabled && bg.soundFileName && bg.waitForLoad) {
        backgroundSoundController.play({
          src: 'assets/' + bg.soundFileName,
          loop: bg.loop !== false,
          interruptBehavior: 'fade',
          interruptFadeDuration: 1,
        });
      }
    }

    // ---------- SCENE TRANSITION ----------
    function playSceneTransition(targetSceneIndex, callback, transitionDuration, targetViewId) {
      const overlay = document.getElementById('sceneTransitionOverlay');
      if (!overlay) {
        callback?.();
        return;
      }
      
      // Use provided duration, fall back to global setting or default
      const duration = (transitionDuration ?? projectData.sceneTransitionDuration ?? 1) * 1000;
      
      // Set transition speed dynamically
      overlay.style.transition = 'opacity ' + (duration / 2000) + 's ease';
      
      // Fade to black
      overlay.classList.add('active');
      
      setTimeout(async () => {
        const leavingSceneIdx = currentSceneIndex;
        const leavingSceneData = getCurrentScene();
        const leavingIsGSExt = (ext) => ext === 'sog' || ext === 'ply' || ext === 'spz';
        const leavingGetExt = (name) => name.toLowerCase().split('.').pop();

        // Save GS compound to cache before clearing
        if (gsSceneCompound && !gsSceneCompound.isDisposed()) {
          const savedParts = {};
          if (leavingSceneData?.threeDElements) {
            for (const el of leavingSceneData.threeDElements) {
              if (loadedElementParts[el.id]) savedParts[el.id] = loadedElementParts[el.id];
            }
          }
          if (gsCompoundCache[leavingSceneIdx]?.compound && !gsCompoundCache[leavingSceneIdx].compound.isDisposed()) {
            gsCompoundCache[leavingSceneIdx].compound.dispose();
          }
          if (Object.keys(savedParts).length > 0) {
            gsSceneCompound.setEnabled(false);
            gsCompoundCache[leavingSceneIdx] = { compound: gsSceneCompound, parts: savedParts };
          } else {
            // Compound has no parts (addPart failed and fallback meshes were used) —
            // caching it would restore an empty, invisible model. Dispose instead.
            console.warn('[Scene] GS compound has no parts — not caching scene', leavingSceneIdx);
            gsSceneCompound.dispose();
          }
          gsSceneCompound = null;
        }

        // Save GLB meshes to cache before clearing.
        // Also stashes standalone GS fallback meshes (GS elements without a compound
        // part proxy — addPart unavailable/failed) so they survive scene switches too.
        if (leavingSceneData?.threeDElements) {
          for (const el of leavingSceneData.threeDElements) {
            if (!el.file?.name) continue;
            if (leavingIsGSExt(leavingGetExt(el.file.name)) && loadedElementParts[el.id]) continue;
            const meshes = loadedElementMeshes[el.id];
            if (meshes?.length) {
              meshes.forEach(m => m.setEnabled(false));
              glbModelCache[el.file.name] = { meshes, animationGroups: glbAnimationGroups[el.id] || [] };
            }
          }
        }

        // Switch scene
        currentSceneIndex = targetSceneIndex;
        currentViewIndex = 0;

        // Clear all non-cached models
        clearAllModels();

        const newScene = getCurrentScene();
        currentSceneType = newScene?.type || 'full-control';
        isCutsceneWaitingForInteraction = false;
        applyCameraLockForSceneType(currentSceneType);

        // Apply environment background for new scene
        applySceneEnvironmentBackground();

        // Start/fade the new scene's background sound
        applySceneBackgroundSound();

        // Show spinner while loading
        overlay.classList.add('loading');

        // Load new scene's models (errors are non-fatal: scene switch still completes)
        try {
          await loadModels();
        } catch (e) {
          console.error('[Scene transition] loadModels failed:', e);
        }

        // Hide spinner before fading back in
        overlay.classList.remove('loading');

        // Start the new scene's background sound now if it was waiting for load to finish
        startSceneBackgroundSoundIfWaiting();

        // Recreate collision primitives for new scene
        try { createCollisionPrimitives(); } catch(e) { console.error('[Scene transition] createCollisionPrimitives failed:', e); }

        // Recreate hotspots for new scene (before jumpToView so visibility is applied correctly)
        try { createHotspots(); } catch(e) { console.error('[Scene transition] createHotspots failed:', e); }

        // Load new scene's requested view (or first view) while still black
        const views = getCurrentViews();
        console.log('[Scene transition] views.length=' + views.length + ' currentSceneIndex=' + currentSceneIndex + ' cam alpha before=' + (camera ? camera.alpha.toFixed(3) : 'null'));
        if (views.length > 0) {
          let targetViewIndex = 0;
          if (targetViewId) {
            const requestedIndex = views.findIndex(v => v.id === targetViewId);
            if (requestedIndex >= 0) targetViewIndex = requestedIndex;
          }
          jumpToView(targetViewIndex);
          console.log('[Scene transition] after jumpToView(' + targetViewIndex + '): alpha=' + (camera ? camera.alpha.toFixed(3) : 'null') + ' beta=' + (camera ? camera.beta.toFixed(3) : 'null') + ' radius=' + (camera ? camera.radius.toFixed(3) : 'null'));
        }

        // Fade back in
        setTimeout(() => {
          overlay.classList.remove('active');
          callback?.();

          // Start cutscene if needed
          if (currentSceneType === 'cutscene') {
            startCutscene();
          }
        }, 100);
      }, duration / 2);
    }

    // ---------- CUTSCENE LOGIC ----------
    function startCutscene() {
      const currentScene = getCurrentScene();
      if (!currentScene || currentScene.type !== 'cutscene') return;
      
      isCutscenePlaying = true;
      cutsceneViewIndex = 0;
      hideNavBar();
      playCutsceneView(0);
    }
    
    // A view flagged pauseCutsceneHere ends the automatic sequence right there
    // (running the scene's end action), even though later views still exist
    // in the list — those remain reachable via button actions etc., just not
    // via automatic advance.
    function advanceCutsceneFrom(index) {
      const views = getCurrentViews();
      if (views[index] && views[index].pauseCutsceneHere) {
        handleCutsceneEnd();
        return;
      }
      playCutsceneView(index + 1);
    }

    function playCutsceneView(index) {
      const views = getCurrentViews();
      if (index >= views.length) {
        handleCutsceneEnd();
        return;
      }

      cutsceneViewIndex = index;
      // Keep currentViewIndex in sync so per-frame logic that reads getCurrentViews()[currentViewIndex]
      // (drone/look-around auto-rotate, camera limits) reflects the view the cutscene is actually
      // showing, instead of whatever view was active before the cutscene started.
      currentViewIndex = index;
      const view = views[index];

      hideAllAnnotations();

      // Tour Camera Path: approach the first keyframe, then travel the full
      // spline before advancing. A plain animateCamera+wait would only play
      // the approach and jump straight to the next cutscene view.
      if (isTourView(view)) {
        applyViewControls(view);
        camera.lowerAlphaLimit = null; camera.upperAlphaLimit = null;
        camera.lowerBetaLimit = null; camera.upperBetaLimit = null;
        camera.lowerRadiusLimit = null; camera.upperRadiusLimit = null;

        playTour(view, false, () => {
          if (isCutscenePlaying && cutsceneViewIndex === index) {
            advanceCutsceneFrom(index);
          }
        });

        // Loop / scroll-along-path tours never naturally complete — fall back
        // to waiting out one lap so the cutscene doesn't stall forever.
