    // Fade animation function for 3D element mesh visibility
    function fade3DElement(elementId, meshes, targetVisibility, durationMs) {
      // Cancel any in-progress fade for this element
      if (activeFadeRafs[elementId] !== undefined) {
        cancelAnimationFrame(activeFadeRafs[elementId]);
        delete activeFadeRafs[elementId];
      }
      if (meshes.length === 0) return;

      const part = loadedElementParts[elementId];

      if (part) {
        // GaussianSplatting proxy: animate part.visibility only.
        // Do NOT call setEnabled on the compound — it would hide all parts.
        const gsStart = (part.visibility !== undefined && part.visibility !== null) ? part.visibility : (targetVisibility === 1 ? 0 : 1);
        const gsStartTime = performance.now();
        const gsDelta = targetVisibility - gsStart;

        function gsStep(now) {
          const elapsed = now - gsStartTime;
          const t = Math.min(elapsed / durationMs, 1.0);
          part.visibility = gsStart + gsDelta * t;
          if (t < 1.0) {
            activeFadeRafs[elementId] = requestAnimationFrame(gsStep);
          } else {
            delete activeFadeRafs[elementId];
          }
        }
        activeFadeRafs[elementId] = requestAnimationFrame(gsStep);
        return;
      }

      // Standard mesh: animate mesh.visibility
      if (targetVisibility === 1) {
        meshes.forEach(mesh => {
          if (!mesh.isEnabled()) {
            mesh.setEnabled(true);
            mesh.visibility = 0;
          }
        });
      }

      const mStart = meshes[0].visibility !== undefined ? meshes[0].visibility : (targetVisibility === 1 ? 0 : 1);
      const mStartTime = performance.now();
      const mDelta = targetVisibility - mStart;

      function mStep(now) {
        const elapsed = now - mStartTime;
        const t = Math.min(elapsed / durationMs, 1.0);
        const cv = mStart + mDelta * t;
        meshes.forEach(mesh => { mesh.visibility = cv; });
        if (t < 1.0) {
          activeFadeRafs[elementId] = requestAnimationFrame(mStep);
        } else {
          delete activeFadeRafs[elementId];
          if (targetVisibility === 0) meshes.forEach(mesh => mesh.setEnabled(false));
        }
      }
      activeFadeRafs[elementId] = requestAnimationFrame(mStep);
    }

    function handle3DElementVisibility(elementIds, mode, fadeEnabled, fadeDuration) {
      const currentScene = projectData.scenes?.[currentSceneIndex];
      if (!currentScene || !currentScene.threeDElements) return;

      const durationMs = (fadeDuration || 1.0) * 1000;

      currentScene.threeDElements.forEach(el => {
        const isTarget = elementIds.includes(el.id);
        const wasVisible = el.visible !== false;
        let newVisible = wasVisible;

        if (mode === 'toggle' && isTarget && fadeEnabled) {
          // Smart swap: use ACTUAL current mesh visibility instead of React state.
          // This ensures crossfade works correctly regardless of initial visibility state.
          const swapPart = loadedElementParts[el.id];
          const swapMeshes = loadedElementMeshes[el.id];
          let actualVisibility = wasVisible ? 1 : 0;
          if (swapPart && swapPart.visibility !== undefined) {
            actualVisibility = swapPart.visibility;
          } else if (swapMeshes && swapMeshes.length > 0 && swapMeshes[0].visibility !== undefined) {
            actualVisibility = swapMeshes[0].visibility;
          }
          newVisible = actualVisibility <= 0.5; // currently hidden → show, currently visible → hide
        } else {
          switch (mode) {
            case 'toggle': if (isTarget) newVisible = !wasVisible; break;
            case 'show':   if (isTarget) newVisible = true; break;
            case 'hide':   if (isTarget) newVisible = false; break;
            case 'show-only': newVisible = isTarget; break;
          }
        }

        if (newVisible === wasVisible && !(mode === 'toggle' && isTarget && fadeEnabled)) return;
        el.visible = newVisible;

        const storedMeshes = loadedElementMeshes[el.id];
        const meshes = (storedMeshes && storedMeshes.length > 0)
          ? storedMeshes
          : scene.meshes.filter(m => m.metadata && m.metadata.elementId === el.id);
        if (!meshes || meshes.length === 0) return;

        if (fadeEnabled) {
          fade3DElement(el.id, meshes, newVisible ? 1 : 0, durationMs);
        } else {
          // Cancel any in-progress fade before instant change
          if (activeFadeRafs[el.id] !== undefined) {
            cancelAnimationFrame(activeFadeRafs[el.id]);
            delete activeFadeRafs[el.id];
          }
          const part = loadedElementParts[el.id];
          if (part) {
            // GS proxy: visibility only — no setEnabled (would affect whole compound)
            part.visibility = newVisible ? 1 : 0;
          } else {
            meshes.forEach(mesh => { mesh.visibility = 1; mesh.setEnabled(newVisible); });
          }
        }
      });
    }
    
    // Update visibility of all 3D elements based on their current state
    function update3DElementVisibility() {
      const currentScene = projectData.scenes?.[currentSceneIndex];
      if (!currentScene || !currentScene.threeDElements || !scene) return;

      currentScene.threeDElements.forEach(el => {
        const isVisible = el.visible !== false;
        const part = loadedElementParts[el.id];

        // First try: use stored mesh references (most reliable)
        const storedMeshes = loadedElementMeshes[el.id];
        if (storedMeshes && storedMeshes.length > 0) {
          if (part) {
            // GS proxy: visibility only — no setEnabled (would affect whole compound)
            part.visibility = isVisible ? 1 : 0;
          } else {
            storedMeshes.forEach(mesh => {
              if (isVisible) mesh.visibility = 1;
              mesh.setEnabled(isVisible);
            });
          }
          return;
        }

        // Fallback: find meshes by metadata.elementId
        scene.meshes.forEach(mesh => {
          if (mesh.metadata && mesh.metadata.elementId === el.id) {
            if (isVisible) mesh.visibility = 1;
            mesh.setEnabled(isVisible);
          }
        });
      });
    }

                scale: 1,
                logging: false,
                ignoreElements: function(el) {
                  return el.closest && (el.closest('[data-snapshot-btn]') || el.closest('[data-nav-bar]'));
                }
              }).then(function(resultCanvas) {
                animatedEls.forEach(function(item) { item.el.setAttribute('style', item.prevStyle); });
                downloadSnapshot(resultCanvas.toDataURL('image/jpeg', 0.95));
              }).catch(function(e) {
                animatedEls.forEach(function(item) { item.el.setAttribute('style', item.prevStyle); });
                console.error('Snapshot failed:', e);
              });
            } else {
              downloadSnapshot(canvas.toDataURL('image/jpeg', 0.95));
            }
          });
          return;
        }
      }
      
      try {
        downloadSnapshot(canvas.toDataURL('image/jpeg', 0.95));
      } catch(e) { console.error('Snapshot failed:', e); }
    }
    
    function createOutsideSnapshotIcon(offset) {
      offset = offset || 0;
      var btn = document.createElement('button');
      btn.id = 'snapshot-outside-icon';
      btn.className = 'snapshot-outside-btn';
      btn.setAttribute('data-snapshot-btn', '');
      var pos = navSettings.snapshotOutsidePosition || 'top-right';
      if (pos === 'top-right') { btn.style.top = '16px'; btn.style.right = (16 + offset) + 'px'; }
      else if (pos === 'top-left') { btn.style.top = '16px'; btn.style.left = (16 + offset) + 'px'; }
      else if (pos === 'bottom-right') { btn.style.bottom = '16px'; btn.style.right = (16 + offset) + 'px'; }
      else { btn.style.bottom = '16px'; btn.style.left = (16 + offset) + 'px'; }
      btn.style.color = navSettings.textColor;
      btn.style.backgroundColor = hexToRgba(navSettings.backgroundColor, navSettings.opacity / 100);
      btn.style.backdropFilter = navSettings.blur ? 'blur(12px)' : 'none';
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>';
      btn.title = 'Take snapshot';
      btn.onclick = takeSnapshot;
      document.body.appendChild(btn);
    }
    
    function removeOutsideSnapshotIcon() {
      var el = document.getElementById('snapshot-outside-icon');
      if (el) el.remove();
    }

    // ---------- FULLSCREEN ----------
    function toggleFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.documentElement.requestFullscreen();
      }
    }

    function createOutsideFullscreenIcon(offset) {
      offset = offset || 0;
      var isFs = !!document.fullscreenElement;
      var btn = document.createElement('button');
      btn.id = 'fullscreen-outside-icon';
      btn.className = 'fullscreen-outside-btn';
      var pos = navSettings.fullscreenOutsidePosition || 'top-right';
      if (pos === 'top-right') { btn.style.top = '16px'; btn.style.right = (16 + offset) + 'px'; }
      else if (pos === 'top-left') { btn.style.top = '16px'; btn.style.left = (16 + offset) + 'px'; }
      else if (pos === 'bottom-right') { btn.style.bottom = '16px'; btn.style.right = (16 + offset) + 'px'; }
      else { btn.style.bottom = '16px'; btn.style.left = (16 + offset) + 'px'; }
      btn.style.color = navSettings.textColor;
      btn.style.backgroundColor = hexToRgba(navSettings.backgroundColor, navSettings.opacity / 100);
      btn.style.backdropFilter = navSettings.blur ? 'blur(12px)' : 'none';
      btn.innerHTML = isFs
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
      btn.title = isFs ? 'Exit fullscreen' : 'Enter fullscreen';
      btn.onclick = toggleFullscreen;
      document.body.appendChild(btn);
    }

    function removeOutsideFullscreenIcon() {
      var el = document.getElementById('fullscreen-outside-icon');
      if (el) el.remove();
    }

    document.addEventListener('fullscreenchange', function() {
      updateNavBar();
      var outsideBtn = document.getElementById('fullscreen-outside-icon');
      if (outsideBtn) {
        var isFs = !!document.fullscreenElement;
        outsideBtn.innerHTML = isFs
          ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>'
          : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
        outsideBtn.title = isFs ? 'Exit fullscreen' : 'Enter fullscreen';
      }
    });

    function createScreenEdgeArrows() {
      removeScreenEdgeArrows();
      
      const arrowSize = navSettings.arrowSize;
      const iconSize = arrowSize;
      
      const createArrow = function(direction) {
        const arrow = document.createElement('div');
        arrow.className = 'screen-edge-arrow ' + direction + ' style-' + navSettings.arrowStyle;
        arrow.id = 'screen-edge-' + direction;
        
        if (navSettings.arrowStyle === 'highlighted') {
          arrow.style.background = 'linear-gradient(to ' + (direction === 'left' ? 'right' : 'left') + ', ' + hexToRgba(navSettings.arrowBackgroundColor, navSettings.arrowBackgroundOpacity / 100) + ', transparent)';
          arrow.style.width = '64px';
        } else if (navSettings.arrowStyle === 'rounded') {
          arrow.style.width = arrowSize + 'px';
          arrow.style.height = arrowSize + 'px';
          arrow.style.background = hexToRgba(navSettings.arrowBackgroundColor, navSettings.arrowBackgroundOpacity / 100);
        } else {
          arrow.style.width = arrowSize + 'px';
          arrow.style.height = arrowSize + 'px';
        }
        
        const polyline = direction === 'left' ? '15 18 9 12 15 6' : '9 18 15 12 9 6';
        arrow.innerHTML = '<svg width="' + iconSize + '" height="' + iconSize + '" viewBox="0 0 24 24" fill="none" stroke="' + navSettings.arrowColor + '" stroke-width="2"><polyline points="' + polyline + '"></polyline></svg>';
        arrow.style.cursor = 'pointer';
        arrow.onclick = direction === 'left' ? previousView : nextView;
        
        document.body.appendChild(arrow);
      };
      
      createArrow('left');
      createArrow('right');
    }
    
    function removeScreenEdgeArrows() {
      const left = document.getElementById('screen-edge-left');
      const right = document.getElementById('screen-edge-right');
      if (left) left.remove();
      if (right) right.remove();
    }
    
    function setupAutoHide() {
      const showNav = function() {
        navBarVisible = true;
        const navBar = document.getElementById("nav-bar");
        if (navBar) navBar.style.opacity = '1';
        const left = document.getElementById('screen-edge-left');
        const right = document.getElementById('screen-edge-right');
        if (left) left.style.opacity = '1';
        if (right) right.style.opacity = '1';
        
        if (autoHideTimeout) clearTimeout(autoHideTimeout);
        autoHideTimeout = setTimeout(hideNav, navSettings.autoHideDelay * 1000);
      };
      
      const hideNav = function() {
        navBarVisible = false;
        const navBar = document.getElementById("nav-bar");
        if (navBar) navBar.style.opacity = '0';
        const left = document.getElementById('screen-edge-left');
        const right = document.getElementById('screen-edge-right');
        if (left) left.style.opacity = '0';
        if (right) right.style.opacity = '0';
      };
      
      document.addEventListener('mousemove', showNav);
      document.addEventListener('click', showNav);
      
      // Initial hide timeout
      autoHideTimeout = setTimeout(hideNav, navSettings.autoHideDelay * 1000);
    }
    
    function hideNavBar() {
      const navBar = document.getElementById("nav-bar");
      navBar.classList.add('hidden');
      removeScreenEdgeArrows();
    }
    
    function goToView(index) {
      navigateToView(index);
    }

    function positionListedPanel() {
      var panel = document.getElementById('nav-listed-panel');
      var toggle = document.getElementById('nav-listed-toggle');
      if (!panel || !toggle) return;
      var rect = toggle.getBoundingClientRect();
      var isTopNav = (navSettings.position || '').includes('top');
      panel.style.left = Math.round(rect.left + rect.width / 2) + 'px';
      panel.style.transform = 'translateX(-50%)';
      if (isTopNav) {
        panel.style.top = Math.round(rect.bottom + 8) + 'px';
        panel.style.bottom = 'auto';
      } else {
        panel.style.top = 'auto';
        panel.style.bottom = (window.innerHeight - Math.round(rect.top) + 8) + 'px';
      }
    }

    function toggleListedDropdown() {
      listedDropdownOpen = !listedDropdownOpen;
      var panel = document.getElementById('nav-listed-panel');
      if (panel) {
        if (listedDropdownOpen) {
          panel.classList.add('open');
          positionListedPanel();
        } else {
          panel.classList.remove('open');
        }
      }
      // Update toggle arrow
      var toggle = document.getElementById('nav-listed-toggle');
      if (toggle) {
        var arrow = toggle.querySelector('.nav-listed-arrow');
        if (arrow) arrow.innerHTML = listedDropdownOpen ? '&#9650;' : '&#9660;';
      }
    }

    function goToViewFromList(index) {
      listedDropdownOpen = false;
      goToView(index);
    }

    // Close listed dropdown when clicking outside
    document.addEventListener('mousedown', function(e) {
      if (!listedDropdownOpen) return;
      var toggle = document.getElementById('nav-listed-toggle');
      var panel = document.getElementById('nav-listed-panel');
      var clickedInsideToggle = toggle && toggle.contains(e.target);
      var clickedInsidePanel = panel && panel.contains(e.target);
      if (!clickedInsideToggle && !clickedInsidePanel) {
        listedDropdownOpen = false;
        if (panel) panel.classList.remove('open');
        if (toggle) {
          var arrow = toggle.querySelector('.nav-listed-arrow');
          if (arrow) arrow.innerHTML = '&#9660;';
        }
      }
    });

    function nextView() {
      const views = getCurrentViews();
      if (currentViewIndex < views.length - 1) {
        navigateToView(currentViewIndex + 1);
      } else if (navSettings.loop) {
        navigateToView(0);
      }
    }

    function previousView() {
      const views = getCurrentViews();
      if (currentViewIndex > 0) {
        navigateToView(currentViewIndex - 1);
      } else if (navSettings.loop) {
        navigateToView(views.length - 1);
      }
    }

    function showLoadingError(msg) {
      const errorEl = document.getElementById('loadingError');
      const errorText = document.getElementById('loadingErrorText');
      if (msg && errorText) errorText.textContent = msg;
      if (errorEl) errorEl.style.display = 'flex';
      const spinner = document.getElementById('loadingSpinner');
      const barContainer = document.getElementById('loadingBarContainer');
      const textEl = document.getElementById('loadingText');
      const details = document.getElementById('loadingDetails');
      if (spinner) spinner.style.display = 'none';
      if (barContainer) barContainer.style.display = 'none';
      if (textEl) textEl.style.display = 'none';
      if (details) details.style.display = 'none';
    }

    // Start
    window.addEventListener("DOMContentLoaded", function() {
      init().catch(function(err) {
        console.error('Initialization failed:', err);
        const isAbort = err && err.name === 'AbortError';
        showLoadingError(isAbort
          ? 'Download timed out. Please check your connection and try again.'
          : 'Failed to load the presentation. Please check your connection and try again.');
      });
    });
  </script>
</body>
</html>
