          hotspot.position.y,
          hotspot.position.z
        );
        // Apply hotspot scale if available (no transform branch)
        if (hotspot.scale) {
          mesh.scaling.setAll(hotspot.scale);
        }
      }

      // Create material based on type
      if (type === 'flat-ring') {
        // Use shader material for flat ring with hotspot's actual color
        const mat = new BABYLON.ShaderMaterial(hotspot.id + '-mat', scene, {
          vertex: 'flatRing',
          fragment: 'flatRing'
        }, {
          attributes: ['position', 'uv'],
          uniforms: ['worldViewProjection', 'color', 'alpha', 'ringThickness', 'isHovered'],
          needAlphaBlending: true
        });
        mat.setColor3('color', new BABYLON.Color3(r, g, b));
        mat.setFloat('alpha', 0.9);
        mat.setFloat('ringThickness', 0.15);
        mat.setFloat('isHovered', 0.0);
        mat.backFaceCulling = false;
        mat.forceDepthWrite = true; // Enable depth writing for occlusion with 3DGS models (discard handles transparent pixels)
        mesh.material = mat;
      } else {
        // Standard material for sphere/cone
        const mat = new BABYLON.StandardMaterial(hotspot.id + '-mat', scene);
        mat.diffuseColor = new BABYLON.Color3(r, g, b);
        mat.emissiveColor = new BABYLON.Color3(r * 0.5, g * 0.5, b * 0.5);
        mat.alpha = 1.0;
        mat.needDepthPrePass = true;
        mesh.material = mat;
      }
      
      // Enable picking
      mesh.isPickable = true;

      // ActionManager for hover effects only — click is handled by the centralized
      // multiPick observer in createHotspots() so it works at any camera distance.
      mesh.actionManager = new BABYLON.ActionManager(scene);

      // Parse hover color
      const hr = parseInt(hoverColor.slice(1, 3), 16) / 255;
      const hg = parseInt(hoverColor.slice(3, 5), 16) / 255;
      const hb = parseInt(hoverColor.slice(5, 7), 16) / 255;
      
      // Hover effects
      mesh.actionManager.registerAction(
        new BABYLON.ExecuteCodeAction(
          BABYLON.ActionManager.OnPointerOverTrigger,
          function() {
            mesh._isHovered = true;
            if (type === 'flat-ring' && mesh.material instanceof BABYLON.ShaderMaterial) {
              mesh.material.setColor3('color', new BABYLON.Color3(hr, hg, hb));
              mesh.material.setFloat('isHovered', 1.0);
              mesh.material.setFloat('ringThickness', 0.20);
            } else if (mesh.material instanceof BABYLON.StandardMaterial) {
              mesh.material.diffuseColor = new BABYLON.Color3(hr, hg, hb);
              mesh.material.emissiveColor = new BABYLON.Color3(hr, hg, hb);
            }
            document.body.style.cursor = 'pointer';
            // Show tooltip
            if (tooltipEl) {
              tooltipEl.classList.add('visible');
            }
          }
        )
      );

      mesh.actionManager.registerAction(
        new BABYLON.ExecuteCodeAction(
          BABYLON.ActionManager.OnPointerOutTrigger,
          function() {
            mesh._isHovered = false;
            if (type === 'flat-ring' && mesh.material instanceof BABYLON.ShaderMaterial) {
              mesh.material.setColor3('color', new BABYLON.Color3(r, g, b));
              mesh.material.setFloat('isHovered', 0.0);
              mesh.material.setFloat('ringThickness', 0.15);
            } else if (mesh.material instanceof BABYLON.StandardMaterial) {
              mesh.material.diffuseColor = new BABYLON.Color3(r, g, b);
              mesh.material.emissiveColor = new BABYLON.Color3(r * 0.5, g * 0.5, b * 0.5);
            }
            document.body.style.cursor = 'default';
            // Hide tooltip
            if (tooltipEl) {
              tooltipEl.classList.remove('visible');
            }
          }
        )
      );
      
      // For 3D ring: add ActionManager to the pick-helper disc for hover effects only
      if (type === '3d-ring' && ringPickDisc) {
        ringPickDisc._hotspotData = hotspot; // needed by the centralized multiPick observer
        ringPickDisc.actionManager = new BABYLON.ActionManager(scene);
        ringPickDisc.actionManager.registerAction(
          new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPointerOverTrigger, function() {
            if (mesh.material instanceof BABYLON.StandardMaterial) {
              mesh.material.diffuseColor = new BABYLON.Color3(hr, hg, hb);
              mesh.material.emissiveColor = new BABYLON.Color3(hr, hg, hb);
            }
            document.body.style.cursor = 'pointer';
            if (tooltipEl) tooltipEl.classList.add('visible');
          })
        );
        ringPickDisc.actionManager.registerAction(
          new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPointerOutTrigger, function() {
            if (mesh.material instanceof BABYLON.StandardMaterial) {
              mesh.material.diffuseColor = new BABYLON.Color3(r, g, b);
              mesh.material.emissiveColor = new BABYLON.Color3(r * 0.5, g * 0.5, b * 0.5);
            }
            document.body.style.cursor = 'default';
            if (tooltipEl) tooltipEl.classList.remove('visible');
          })
        );
      }

      // Store mesh with hotspot data for tooltip positioning
      mesh._hotspotData = hotspot;
      mesh._tooltipEl = tooltipEl;
      hotspot3DMeshes.push(mesh);
    }
    
    function updateHotspotPositions() {
      if (!camera || !engine) return;
      
      const canvasWidth = engine.getRenderWidth();
      const canvasHeight = engine.getRenderHeight();
      
      hotspotMeshes.forEach(({ marker, hotspot }) => {
        const pos3D = new BABYLON.Vector3(
          parseFloat(marker.getAttribute('data-pos-x')),
          parseFloat(marker.getAttribute('data-pos-y')),
          parseFloat(marker.getAttribute('data-pos-z'))
        );
        
        // Project 3D position to screen coordinates
        const screenPos = BABYLON.Vector3.Project(
          pos3D,
          BABYLON.Matrix.Identity(),
          scene.getTransformMatrix(),
          camera.viewport.toGlobal(canvasWidth, canvasHeight)
        );
        
        // Check if behind camera
        const cameraToHotspot = pos3D.subtract(camera.position);
        const cameraForward = camera.target.subtract(camera.position).normalize();
        const dot = BABYLON.Vector3.Dot(cameraToHotspot.normalize(), cameraForward);
        
        // All hotspots are visible from any angle (angleMin/angleMax removed)
        // Only check if hotspot is in front of camera and within screen bounds
        const isVisible = dot > 0 && 
                          screenPos.x >= 0 && screenPos.x <= canvasWidth &&
                          screenPos.y >= 0 && screenPos.y <= canvasHeight;
        
        if (isVisible) {
          marker.classList.remove('hidden');
          marker.style.left = screenPos.x + 'px';
          marker.style.top = screenPos.y + 'px';
          hotspotScreenPositions[hotspot.id] = { x: screenPos.x, y: screenPos.y };
        } else {
          marker.classList.add('hidden');
        }
      });
      
      // Update 3D hotspot tooltip positions AND store screen positions for binding
      hotspot3DMeshes.forEach(mesh => {
        const pos3D = mesh.position;
        const screenPos = BABYLON.Vector3.Project(
          pos3D,
          BABYLON.Matrix.Identity(),
          scene.getTransformMatrix(),
          camera.viewport.toGlobal(canvasWidth, canvasHeight)
        );
        
        // Check if in front of camera
        const cameraToHotspot = pos3D.subtract(camera.position);
        const cameraForward = camera.target.subtract(camera.position).normalize();
        const dot = BABYLON.Vector3.Dot(cameraToHotspot.normalize(), cameraForward);
        
        if (dot > 0 && screenPos.x >= 0 && screenPos.x <= canvasWidth && screenPos.y >= 0 && screenPos.y <= canvasHeight) {
          if (mesh._tooltipEl) {
            mesh._tooltipEl.style.left = screenPos.x + 'px';
            mesh._tooltipEl.style.top = screenPos.y + 'px';
          }
          // Store screen position for connector lines and bound annotation positioning
          if (mesh._hotspotData && mesh._hotspotData.id) {
            hotspotScreenPositions[mesh._hotspotData.id] = { x: screenPos.x, y: screenPos.y };
          }
        }
      });
    }

    // ---------- HOTSPOT IDLE ANIMATIONS ----------
    function updateHotspotAnimations() {
      if (!hotspot3DMeshes || hotspot3DMeshes.length === 0) return;
      var t = performance.now() / 1000;

      hotspot3DMeshes.forEach(function(mesh) {
        var hotspot = mesh._hotspotData;
        if (!hotspot) return;
        var animType = hotspot.animation && hotspot.animation.type;
        if (!animType || animType === 'none') return;

        var speed = (hotspot.animation && hotspot.animation.speed) || 1.0;
        var phase = t * speed * Math.PI;

        if (animType === 'bobbing') {
          var amplitude = 0.12;
          var localY = mesh.getDirection(new BABYLON.Vector3(0, 1, 0));
          var dataPos = hotspot.transform
            ? new BABYLON.Vector3(hotspot.transform.position[0], hotspot.transform.position[1], hotspot.transform.position[2])
            : new BABYLON.Vector3(hotspot.position.x, hotspot.position.y, hotspot.position.z);
          var offset = localY.scale(Math.sin(phase) * amplitude);
          mesh.position.copyFrom(dataPos.add(offset));

        } else if (animType === 'pulsing') {
          var baseScale = hotspot.scale || (hotspot.transform ? hotspot.transform.scale[0] : 1.0);
          var s = baseScale * (1 + Math.sin(phase) * 0.18);
          mesh.scaling.setAll(s);

        } else if (animType === 'color-fade') {
          // Skip when hovered — hover color takes priority
          if (mesh._isHovered) return;
          if (mesh.material instanceof BABYLON.StandardMaterial) {
            var bc = hotspot.color || '#00ffff';
            var hc = hotspot.hoverColor || '#06b5d0';
            var br = parseInt(bc.slice(1, 3), 16) / 255;
            var bg = parseInt(bc.slice(3, 5), 16) / 255;
            var bb = parseInt(bc.slice(5, 7), 16) / 255;
            var chr = parseInt(hc.slice(1, 3), 16) / 255;
            var chg = parseInt(hc.slice(3, 5), 16) / 255;
            var chb = parseInt(hc.slice(5, 7), 16) / 255;
            var lerp = (Math.sin(phase) + 1) / 2;
            var dr = br + (chr - br) * lerp;
            var dg = bg + (chg - bg) * lerp;
            var db = bb + (chb - bb) * lerp;
            var em = 0.5 + lerp * 0.5;
            mesh.material.diffuseColor = new BABYLON.Color3(dr, dg, db);
            mesh.material.emissiveColor = new BABYLON.Color3(dr * em, dg * em, db * em);
          }
        }
      });
    }

    // ---------- CONNECTOR LINES & BOUND ANNOTATION POSITIONING ----------
    function updateConnectorLines() {
      const svgContainer = document.getElementById('connector-line-container');
      if (!svgContainer) return;
      svgContainer.innerHTML = '';

      // Don't show connector lines during camera transitions
      if (isAnimating) return;

      const currentScene = getCurrentScene();
      if (!currentScene) return;
      const hotspots = currentScene.hotspots || [];
      const views = getCurrentViews();
      const viewIndex = currentViewIndex;
      const currentView = views[viewIndex];
      if (!currentView) return;
      const annotations = currentView.annotations || [];

      // Get annotation scale factor
      const dw = projectData.designWidth || 0;
      const dh = projectData.designHeight || 0;
      const scaleOverride = projectData.annotationScaleOverride != null ? projectData.annotationScaleOverride : 100;
      let annotationScaleFactor = 1;
      if (dw > 0 && dh > 0) {
        const factor = Math.min(window.innerWidth / dw, window.innerHeight / dh);
        const overrideMultiplier = scaleOverride / 100;
        annotationScaleFactor = Math.min(3.0, Math.max(0.25, 1 + (factor - 1) * overrideMultiplier));
      }

      annotations.forEach(function(ann) {
        if (!ann.boundToHotspotId) return;
        if (hiddenAnnotationIds.has(ann.id)) return;
        const boundHotspot = hotspots.find(function(h) { return h.id === ann.boundToHotspotId; });
        if (!boundHotspot || !boundHotspot.boundAnnotationShowLine) return;
        const screenPos = hotspotScreenPositions[ann.boundToHotspotId];
        if (!screenPos) return;

        const dist = boundHotspot.boundAnnotationDistance || 120;
        const angleDeg = boundHotspot.boundAnnotationAngle || 0;
        const angleRad = ((angleDeg - 90) * Math.PI) / 180;
        const scaledHx = screenPos.x / annotationScaleFactor;
        const scaledHy = screenPos.y / annotationScaleFactor;
        const boxCx = scaledHx + Math.cos(angleRad) * dist;
        const boxCy = scaledHy + Math.sin(angleRad) * dist;

        const anchor = boundHotspot.boundAnnotationLineAnchor || 'center';
        const boxW = ann.width || 300;
        var lineEndX = boxCx;
        if (anchor === 'left') lineEndX = boxCx - boxW / 2;
        else if (anchor === 'right') lineEndX = boxCx + boxW / 2;

        const lineWidth = boundHotspot.boundAnnotationLineWidth || 2;
        const lineColor = boundHotspot.boundAnnotationLineColor || boundHotspot.color || '#00ffff';
        const lineStyle = boundHotspot.boundAnnotationLineStyle || 'dashed';
        const endIcon = boundHotspot.boundAnnotationLineEndIcon || 'none';

        // Scale coordinates back to screen pixels for the SVG (which is in screen space)
        const sx1 = scaledHx * annotationScaleFactor;
        const sy1 = scaledHy * annotationScaleFactor;
        const sx2 = lineEndX * annotationScaleFactor;
        const sy2 = boxCy * annotationScaleFactor;

        const ns = 'http://www.w3.org/2000/svg';
        const g = document.createElementNS(ns, 'g');

        // Calculate fade-in delay based on annotation animation
        const annAnim = ann.animation;
        const views2 = getCurrentViews();
        const currentView2 = views2[currentViewIndex];
        const allAnns = currentView2 ? (currentView2.annotations || []) : [];
        const delays = calculateSequenceDelays(allAnns);
        const annIdx = allAnns.findIndex(function(a) { return a.id === ann.id; });
        const seqDelay = annIdx >= 0 ? delays[annIdx] : 0;
        const animDur = (annAnim && annAnim.duration) ? annAnim.duration : 0.5;
        const animType = annAnim ? annAnim.type : 'none';
        const hasAnimation = animType && animType !== 'none' && animType !== 'typewriter';

        if (hasAnimation && connectorLineViewStartTime > 0) {
          const totalDelay = seqDelay + animDur;
          const elapsed = (performance.now() / 1000) - connectorLineViewStartTime;
          const fadeStart = totalDelay;
          const fadeDuration = 0.4;
          if (elapsed < fadeStart) {
            g.setAttribute('opacity', '0');
          } else if (elapsed < fadeStart + fadeDuration) {
            const progress = (elapsed - fadeStart) / fadeDuration;
            g.setAttribute('opacity', String(0.7 * progress));
          } else {
            g.setAttribute('opacity', '0.7');
          }
        } else {
          g.setAttribute('opacity', '0.7');
        }

        const line = document.createElementNS(ns, 'line');
        line.setAttribute('x1', sx1);
        line.setAttribute('y1', sy1);
        line.setAttribute('x2', sx2);
        line.setAttribute('y2', sy2);
        line.setAttribute('stroke', lineColor);
        line.setAttribute('stroke-width', lineWidth);
        if (lineStyle === 'dashed') {
          line.setAttribute('stroke-dasharray', (6 * lineWidth / 2) + ' ' + (3 * lineWidth / 2));
        }
        g.appendChild(line);

        const arrowAngle = Math.atan2(sy1 - sy2, sx1 - sx2);
        const iconSize = (boundHotspot.boundAnnotationLineEndIconSize || 4) + lineWidth;

        if (endIcon === 'arrow') {
          const a = arrowAngle;
          const s = iconSize;
          const p1x = sx1 + Math.cos(a) * s;
          const p1y = sy1 + Math.sin(a) * s;
          const p2x = sx1 + Math.cos(a + 2.4) * s * 0.6;
          const p2y = sy1 + Math.sin(a + 2.4) * s * 0.6;
          const p3x = sx1 + Math.cos(a - 2.4) * s * 0.6;
          const p3y = sy1 + Math.sin(a - 2.4) * s * 0.6;
          const poly = document.createElementNS(ns, 'polygon');
          poly.setAttribute('points', p1x + ',' + p1y + ' ' + p2x + ',' + p2y + ' ' + p3x + ',' + p3y);
          poly.setAttribute('fill', lineColor);
          g.appendChild(poly);
        } else if (endIcon === 'ring') {
          const circ = document.createElementNS(ns, 'circle');
          circ.setAttribute('cx', sx1);
          circ.setAttribute('cy', sy1);
          circ.setAttribute('r', iconSize * 0.7);
          circ.setAttribute('fill', 'none');
          circ.setAttribute('stroke', lineColor);
          circ.setAttribute('stroke-width', lineWidth);
          g.appendChild(circ);
        } else if (endIcon === 'dot') {
          const circ = document.createElementNS(ns, 'circle');
          circ.setAttribute('cx', sx1);
          circ.setAttribute('cy', sy1);
          circ.setAttribute('r', iconSize * 0.5);
          circ.setAttribute('fill', lineColor);
          g.appendChild(circ);
        }

        svgContainer.appendChild(g);
      });
    }

    function updateBoundAnnotationPositions() {
      const currentScene = getCurrentScene();
      if (!currentScene) return;
      const hotspots = currentScene.hotspots || [];

      const dw = projectData.designWidth || 0;
      const dh = projectData.designHeight || 0;
      const scaleOverride = projectData.annotationScaleOverride != null ? projectData.annotationScaleOverride : 100;
      let annotationScaleFactor = 1;
      if (dw > 0 && dh > 0) {
        const factor = Math.min(window.innerWidth / dw, window.innerHeight / dh);
        const overrideMultiplier = scaleOverride / 100;
        annotationScaleFactor = Math.min(3.0, Math.max(0.25, 1 + (factor - 1) * overrideMultiplier));
      }

      const containerW = window.innerWidth / annotationScaleFactor;
      const containerH = window.innerHeight / annotationScaleFactor;

      const boundDivs = document.querySelectorAll('[data-bound-hotspot-id]');
      boundDivs.forEach(function(div) {
        const hotspotId = div.getAttribute('data-bound-hotspot-id');
        const boundHotspot = hotspots.find(function(h) { return h.id === hotspotId; });
        if (!boundHotspot) return;
        const screenPos = hotspotScreenPositions[hotspotId];
        if (!screenPos) return;

        const dist = boundHotspot.boundAnnotationDistance || 120;
        const angleDeg = boundHotspot.boundAnnotationAngle || 0;
        const angleRad = ((angleDeg - 90) * Math.PI) / 180;
        const scaledX = screenPos.x / annotationScaleFactor;
        const scaledY = screenPos.y / annotationScaleFactor;
        const annCenterX = scaledX + Math.cos(angleRad) * dist;
        const annCenterY = scaledY + Math.sin(angleRad) * dist;

        const posX = containerW > 0 ? (annCenterX / containerW) * 100 : 50;
        const posY = containerH > 0 ? (annCenterY / containerH) * 100 : 50;

        div.style.left = posX + '%';
        div.style.top = posY + '%';
        div.style.transform = 'translateX(-50%) translateY(-50%)';
      });
    }
    
    function handleHotspotClick(hotspot, idx) {
      // Always close any existing popup first
      closeHotspotPopup();
      
      // Flat-ring / 3D-ring navigation: animate camera to ring position at navigation height
      // Only if useAsNavigationSpot is enabled (default true for backward compatibility)
      var useAsNav = hotspot.useAsNavigationSpot !== false;
      if (useAsNav && ((hotspot.type || 'billboard') === 'flat-ring' || (hotspot.type || 'billboard') === '3d-ring')) {
        var navHeight = hotspot.navigationHeight != null ? hotspot.navigationHeight : 1.7;
        var navDuration = hotspot.navigationDuration != null ? hotspot.navigationDuration : 1.0;
        
        // Get hotspot position from transform (preferred) or legacy position
        var hpX = hotspot.transform ? hotspot.transform.position[0] : hotspot.position.x;
        var hpZ = hotspot.transform ? hotspot.transform.position[2] : hotspot.position.z;
        
        // Calculate forward direction from current camera to maintain look direction
        var dx = camera.target.x - camera.position.x;
        var dz = camera.target.z - camera.position.z;
        var len = Math.sqrt(dx * dx + dz * dz) || 1;
        var fwdX = dx / len;
        var fwdZ = dz / len;
        
        var lookDistance = 5;
        var syntheticView = {
          position: { x: hpX, y: navHeight, z: hpZ },
          target: { x: hpX + fwdX * lookDistance, y: navHeight, z: hpZ + fwdZ * lookDistance },
          fov: camera.fov * (180 / Math.PI),
          animationDuration: navDuration,
          orthographic: false,
          clipValue: 0
        };
        
        isAnimating = true;
        animateCamera(syntheticView, function() {
          isAnimating = false;
        });
        return;
      }
      
      const hasLink = hotspot.linkToViewId;
      const content = hotspot.content;
      const isGoToScene = content && content.function === 'go-to-scene' && content.targetSceneId;
      const hasContent = content && content.function !== 'none' && !isGoToScene;

      const executeAction = () => {
        if (isGoToScene) {
          navigateToSceneById(content.targetSceneId, content.transition?.duration, content.targetSceneCameraId);
        } else if (hasContent) {
          showHotspotPopup(hotspot, idx);
        }
      };

      // If hotspot has a linked camera view, navigate to it first
      // (a link to a tour member resolves to its parent tour)
      if (hasLink) {
        const views = getCurrentViews();
        const linkedViewIndex = resolveViewIndexById(hotspot.linkToViewId);

        if (linkedViewIndex >= 0) {
          const alreadyAtView = linkedViewIndex === currentViewIndex;

          // Always animate for camera-only hotspots (re-centers camera to saved position).
          // For hotspots with content, skip animation if already at the linked view.
          if (!alreadyAtView || (!hasContent && !isGoToScene)) {
            currentViewIndex = linkedViewIndex;
            const view = views[linkedViewIndex];

            if (isTourView(view)) {
              navigateToView(linkedViewIndex);
              executeAction();
              return;
            }

            // Apply manual control settings and camera limits for this view
            applyViewControls(view);

            hideAllAnnotations();
            isAnimating = true;

            animateCamera(view, () => {
              isAnimating = false;
              displayAnnotations(view);
              updateNavBar();
              executeAction();
            });
            return;
          }
          // Already at linked view and has content: show popup/navigate immediately
        }
      }

      // No camera binding, or already at the view with content - execute action immediately
      executeAction();
    }
    
    function showHotspotPopup(hotspot, idx) {
      closeHotspotPopup();
      
      const container = document.getElementById('hotspot-popup-container');
      const content = hotspot.content;
      const hasLink = hotspot.linkToViewId;
      const hasContent = content && content.function !== 'none';
      
      // If no content and no link, don't show popup
      if (!hasContent && !hasLink) return;
      
      const style = content?.style || {
        x: 50,
        y: 50,
        width: 50,
        transparency: 80,
        blur: 0,
        outlineWidth: 0,
        outlineColor: '#ffffff',
        backgroundColor: '#000000',
        borderRadius: 8,
        padding: 16
      };
      
      // Calculate width multiplier based on aspect ratio and description position (matching editor)
      const isDocument = content?.function === 'open-document';
      const aspectRatio = content?.aspectRatio || '1:1';
      const descPos = content?.descriptionPosition || 'bottom';
      const showDescription = content?.showDescription ?? false;
      const hasHorizontalLayout = (descPos === 'left' || descPos === 'right') && showDescription;
      
      let actualWidth;
      if (isDocument) {
        actualWidth = style.width * 0.35;
      } else {
        let widthMultiplier = 0.3; // Default 1:1
        if (aspectRatio === '16:9') widthMultiplier = 0.4;
        else if (aspectRatio === '9:16') widthMultiplier = 0.2;
        
        if (hasHorizontalLayout) {
          if (aspectRatio === '9:16') widthMultiplier = 0.5;
          else if (aspectRatio === '1:1') widthMultiplier = 0.55;
          else widthMultiplier = 0.6; // 16:9
        }
        actualWidth = style.width * widthMultiplier;
      }
      
      activeHotspotPopup = hotspot.id;
      hotspotCarouselIndices[hotspot.id] = 0;
      
      const popup = document.createElement('div');
      popup.className = 'hotspot-popup';
      popup.id = `hotspot-popup-${idx}`;
      popup.style.left = style.x + '%';
      popup.style.top = style.y + '%';
      popup.style.width = actualWidth + '%';
      popup.style.maxWidth = '90vw';
      
      const bgAlpha = Math.round((style.transparency / 100) * 255).toString(16).padStart(2, '0');
      
      let contentHtml = '';
      
      // getAspectRatioValue is now defined at top-level scope
      
      // Helper function to build description HTML with branding fonts
      const buildDescriptionHtml = () => {
        if (!showDescription || !content.description) return '';
        const descSize = content.descriptionSize || 14;
        const sideClass = (descPos === 'left' || descPos === 'right') ? 'side' : '';
        // Use branding body font if enabled, otherwise default
        const brand = projectData.brandSettings || {};
        const descFont = brand.enabled ? (brand.bodyFontFamily || 'Inter, sans-serif') : 'Inter, sans-serif';
        return `<div class="hotspot-description ${sideClass}" style="font-size: ${descSize}px; font-family: ${descFont};">${content.description.replace(/\n/g, '<br>')}</div>`;
      };
      
      // Render content based on function type
      if (hasContent) {
        switch (content.function) {
          case 'image-carousel':
            const images = content.images || [];
            if (images.length > 0) {
              const carouselId = `carousel-${idx}`;
              const aspectValue = getAspectRatioValue(aspectRatio);
              const navStyle = content.carouselNavStyle || 'inside';
              const showArrowsAlways = content.showCarouselArrowsAlways ? 'always-visible' : '';
              const isHighlighted = navStyle === 'highlighted';

    function closeHotspotPopup() {

    // Draggable popup support
    function initPopupDrag(popup) {

      dragBar.addEventListener('mousedown', function(e) {
        e.preventDefault();
        startX = e.clientX;
        startY = e.clientY;
        startLeft = parseFloat(popup.style.left) || 50;
        startTop = parseFloat(popup.style.top) || 50;
        function onMove(ev) {
          const dx = (ev.clientX - startX) / window.innerWidth * 100;
          const dy = (ev.clientY - startY) / window.innerHeight * 100;
          popup.style.left = Math.max(5, Math.min(95, startLeft + dx)) + '%';
          popup.style.top = Math.max(5, Math.min(95, startTop + dy)) + '%';
        }
        function onUp() {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
      // Touch support
      dragBar.addEventListener('touchstart', function(e) {
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        startLeft = parseFloat(popup.style.left) || 50;
        startTop = parseFloat(popup.style.top) || 50;
        function onTouchMove(ev) {
          ev.preventDefault();
          const t = ev.touches[0];
          const dx = (t.clientX - startX) / window.innerWidth * 100;
          const dy = (t.clientY - startY) / window.innerHeight * 100;

    // ---------- NAVIGATION ----------
    function applyViewControls(view) {
      if (window.__DIORAMIX_DEBUG_CAMERA_LIMITS) console.log('applyViewControls', view && view.name ? view.name : view && view.id ? view.id : currentViewIndex);
      if (!camera || !view) return;

      const controls = view.controls || { arcRotate: true, wasd: true, rightClickPan: true };
      const cameraType = view.cameraType || 'stationary';

      // Look-around mode: switch to FPV camera
      if (cameraType === 'look-around' && fpvCamera) {
        if (scene.activeCamera !== fpvCamera) {
          camera.detachControl();
          fpvCamera.position = camera.position.clone();
          const direction = camera.target.subtract(camera.position).normalize();
          fpvCamera.setTarget(camera.position.add(direction));
          fpvCamera.fov = camera.fov;
          fpvCamera.attachControl(canvas, true);
          scene.activeCamera = fpvCamera;
        }
        // Disable orbit camera rotation
        camera.angularSensibilityX = 999999;
        camera.angularSensibilityY = 999999;
      } else {
        // Non-look-around: ensure orbit camera is active
        if (fpvCamera && scene.activeCamera === fpvCamera) {
          fpvCamera.detachControl();
          const newPos = fpvCamera.position.clone();
          const fwd = fpvCamera.getDirection(BABYLON.Vector3.Forward());
          const newTarget = newPos.add(fwd.scale(camera.radius || 10));
          camera.setPosition(newPos);
          camera.setTarget(newTarget);
          camera.attachControl(canvas, true);
          scene.activeCamera = camera;
        }
        
        // Arc rotate (mouse drag to orbit)
        if (controls.arcRotate === false) {
          camera.angularSensibilityX = 999999;
          camera.angularSensibilityY = 999999;
        } else {
          camera.angularSensibilityX = 2000;
          camera.angularSensibilityY = 2000;
        }
      }
      
      // WASD movement
      wasdEnabled = controls.wasd !== false;
      
      // Right-click pan (use vcSavedFpv for panning speed if available)
      if (controls.rightClickPan === false) {
        camera.panningSensibility = 0;
      } else {
        var fpvMult = (typeof vcSavedFpv !== 'undefined' ? vcSavedFpv : 1);
        camera.panningSensibility = Math.max(10, 150 / fpvMult);
      }
      // Re-apply zoom speed after view transition
      if (typeof vcSavedZoom !== 'undefined') {
        camera.wheelDeltaPercentage = vcSavedZoom * 0.0002;
      }
      // Camera limits are applied AFTER animation completes (not here)
      // to prevent jerky transitions when limits differ between views
      
      // Show/hide hotspots based on view's showHotspots setting
      const showHotspots = view.showHotspots !== false; // default true
      const hotspotContainer = document.getElementById('hotspot-container');
      if (hotspotContainer) {
        hotspotContainer.style.display = showHotspots ? '' : 'none';
      }
      // Also hide/show 3D hotspot meshes
      hotspot3DMeshes.forEach(function(mesh) {

        mesh.isPickable = showHotspots;
      });
    }
    
    function navigateToView(index) {
      const views = getCurrentViews();
      if (views.length === 0) return;

      currentViewIndex = index;
      const view = views[index];

      // Close any open hotspot popup when navigating
      closeHotspotPopup();

      // Tour Camera Path: approach the first keyframe, then travel the spline
      if (isTourView(view)) {
        applyViewControls(view);
        camera.lowerAlphaLimit = null; camera.upperAlphaLimit = null;
        camera.lowerBetaLimit = null; camera.upperBetaLimit = null;
        camera.lowerRadiusLimit = null; camera.upperRadiusLimit = null;
        hideAllAnnotations();
        playTour(view, false);
        updateNavBar();
        return;
      }

      // Apply manual control settings for this view (except camera limits)
      applyViewControls(view);

      // Remove all camera limits during transition so camera moves freely
      camera.lowerAlphaLimit = null; camera.upperAlphaLimit = null;
      camera.lowerBetaLimit = null; camera.upperBetaLimit = null;
      camera.lowerRadiusLimit = null; camera.upperRadiusLimit = null;
      
      hideAllAnnotations();
      isAnimating = true;

      animateCamera(view, () => {
        isAnimating = false;
        // Apply camera limits AFTER animation completes
        try {
          setCameraLimitsForView(view);

          console.warn('Failed to apply camera limits for view', e);

        displayAnnotations(view);
        triggerCameraActivatedGlbAnimations(view.id);

    function jumpToView(index) {
      const views = getCurrentViews();
      if (views.length === 0 || !views[index]) return;

      // Cancel any running animateCamera RAF loop so it cannot override the jump destination
      cameraAnimationVersion++;
      isAnimating = false;

      currentViewIndex = index;
      const view = views[index];

      if (window.__DIORAMIX_DEBUG_CAMERA_LIMITS) console.log('jumpToView', index);
      // Close any open hotspot/video popup when jumping to a new view
      closeHotspotPopup();

      // Apply manual control settings for this view
      applyViewControls(view);

      // STEP 1: Clear ALL camera limits unconditionally before moving camera.
      // (Mirrors editor behavior: limits are cleared first, position set, then limits re-applied.)
      // If limits are applied BEFORE the new alpha/beta, Babylon.js _checkInputs() clamps
      // alpha/beta back to the old-view limits during the very next scene.render() call.
      camera.lowerAlphaLimit = null;
      camera.upperAlphaLimit = null;
      camera.lowerBetaLimit  = null;
      camera.upperBetaLimit  = null;
      camera.lowerRadiusLimit = null;
      camera.upperRadiusLimit = null;

      // STEP 2: Clear inertia and pending input so no residual drag overrides the jump.
      camera.inertialAlphaOffset = 0;
      camera.inertialBetaOffset = 0;
      camera.inertialRadiusOffset = 0;
      if (camera.inertialPanningX !== undefined) camera.inertialPanningX = 0;
      if (camera.inertialPanningY !== undefined) camera.inertialPanningY = 0;

      // STEP 3: Instant camera jump — ArcRotateCamera renders from alpha/beta/radius, not position directly.
      // Use setTarget() + direct spherical coords to guarantee correct placement regardless of
      // any accumulated panning offset (_viewOffset) that would skew setPosition/rebuildAnglesAndRadius.
      var _jumpTarget = new BABYLON.Vector3(view.target.x, view.target.y, view.target.z);
      var _jumpPos    = new BABYLON.Vector3(view.position.x, view.position.y, view.position.z);
      var _jumpDir    = _jumpPos.subtract(_jumpTarget);
      var _jumpRadius = _jumpDir.length();
      if (camera._viewOffset) camera._viewOffset.set(0, 0, 0);
      camera.setTarget(_jumpTarget);
      camera.radius = _jumpRadius;
      if (_jumpRadius > 0.0001) {
        camera.alpha = Math.atan2(_jumpDir.z, _jumpDir.x);
        camera.beta  = Math.acos(Math.max(-1, Math.min(1, _jumpDir.y / _jumpRadius)));
      }
      camera.fov = (view.fov * Math.PI) / 180;

      // STEP 4: Re-apply camera limits for the new view NOW that camera.alpha/beta match the
      // new position — the alpha normalization in setCameraLimitsForView uses camera.alpha,
      // so it must run after the jump, not before.
      try { setCameraLimitsForView(view); } catch(e) {}

      // Reset delta-clamping reference values so the next render frame doesn't throttle the
      // large alpha/beta jump that results from teleporting the camera to a new position.
      __lastAlpha = null;
      __lastBeta = null;
      // Activate render-loop debug logging for next 5 frames
      __debugFrames = 5;
      
      // Handle orthographic mode
      if (view.orthographic) {
        camera.mode = BABYLON.Camera.ORTHOGRAPHIC_CAMERA;

        camera.orthoBottom = -oSize;

        camera.orthoRight = oSize * aspect;

        camera.mode = BABYLON.Camera.PERSPECTIVE_CAMERA;
      }

      if (fpvCamera && (view.cameraType === 'look-around')) {
        fpvCamera.position = camera.position.clone();
        const dir = camera.target.subtract(camera.position).normalize();
        fpvCamera.setTarget(camera.position.add(dir));
        fpvCamera.fov = camera.fov;
      }
      
      // Update clipping
      if (view.clipValue !== undefined) {
        updateClippingPlane(view.clipValue);
        currentClipValue = view.clipValue;
      }
      
      hideAllAnnotations();
      displayAnnotations(view);
      updateNavBar();

      // Tour Camera Path: the jump above landed on the first keyframe
      // (tour cards mirror member 0's pose) — start travel without an approach
      if (isTourView(view)) {
        startTourPlayback(view);
      }
    }

    function animateCamera(view, onComplete) {
      if (window.__DIORAMIX_DEBUG_CAMERA_LIMITS) console.log('animateCamera start', view && view.name ? view.name : currentViewIndex);
      const duration = (view.animationDuration || 1.5) * 1000;
      const startTime = Date.now();
      const myVersion = ++cameraAnimationVersion;

      const startPos = camera.position.clone();
      const startTarget = camera.target.clone();
      const startFov = camera.fov;
      const startClip = currentClipValue;

      const targetPos = new BABYLON.Vector3(view.position.x, view.position.y, view.position.z);
      const targetTarget = new BABYLON.Vector3(view.target.x, view.target.y, view.target.z);
      const targetFov = (view.fov * Math.PI) / 180;
      const targetClip = view.clipValue !== undefined ? view.clipValue : 0;

      // Orthographic ↔ Perspective smooth transition setup
      var targetIsOrtho = !!view.orthographic;
      var startIsOrtho = camera.mode === BABYLON.Camera.ORTHOGRAPHIC_CAMERA;
      var orthoAspect = canvas.width / canvas.height;
      var isModeTransition = startIsOrtho !== targetIsOrtho;

      // Capture ortho values BEFORE any mode changes
      var savedOrthoTop = camera.orthoTop;

      var startOrthoSize = 0;
      var targetOrthoSize = 0;

      if (startIsOrtho && targetIsOrtho) {
        camera.mode = BABYLON.Camera.ORTHOGRAPHIC_CAMERA;
        var sDist = BABYLON.Vector3.Distance(startPos, startTarget);
        var tDist = BABYLON.Vector3.Distance(targetPos, targetTarget);
        startOrthoSize = savedOrthoTop || (sDist * 0.5);
        targetOrthoSize = tDist * 0.5;
      } else if (isModeTransition) {
        var sDist2 = BABYLON.Vector3.Distance(startPos, startTarget);
        var tDist2 = BABYLON.Vector3.Distance(targetPos, targetTarget);
        startOrthoSize = startIsOrtho ? (savedOrthoTop || sDist2 * 0.5) : (sDist2 * Math.tan(startFov / 2));
        targetOrthoSize = targetIsOrtho ? (tDist2 * 0.5) : (tDist2 * Math.tan(targetFov / 2));
        camera.mode = BABYLON.Camera.PERSPECTIVE_CAMERA;

        // Stop if a newer animation or jumpToView has been triggered

        const progress = Math.min(elapsed / duration, 1);
        const eased = easeInOutCubic(progress);

        camera.position = BABYLON.Vector3.Lerp(startPos, targetPos, eased);
        camera.target = BABYLON.Vector3.Lerp(startTarget, targetTarget, eased);
        
        // Animate clipping plane
        const clipProgress = startClip + (targetClip - startClip) * eased;
        updateClippingPlane(clipProgress);
        currentClipValue = clipProgress;

        if (isModeTransition) {

          var near = camera.minZ || 0.1;

          var perspMatrix = BABYLON.Matrix.PerspectiveFovLH(currentFov, orthoAspect, near, far);

          var orthoH = curOrthoSz * 2;
          var orthoMatrix = BABYLON.Matrix.OrthoLH(orthoW, orthoH, near, far);

          camera.orthoBottom = -curOrtho;

          camera.orthoRight = curOrtho * orthoAspect;
        } else {
          camera.fov = startFov + (targetFov - startFov) * eased;
        }

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          // Unfreeze projection matrix
          camera.unfreezeProjectionMatrix();

          if (targetIsOrtho) {
            camera.mode = BABYLON.Camera.ORTHOGRAPHIC_CAMERA;
            var finalDist = BABYLON.Vector3.Distance(targetPos, targetTarget);
            var finalOrtho = (startIsOrtho && targetIsOrtho) ? targetOrthoSize : finalDist * 0.5;
            camera.orthoTop = finalOrtho;
            camera.orthoBottom = -finalOrtho;
            camera.orthoLeft = -finalOrtho * orthoAspect;
            camera.orthoRight = finalOrtho * orthoAspect;
            camera.fov = targetFov;
          } else {
            camera.mode = BABYLON.Camera.PERSPECTIVE_CAMERA;
            camera.fov = targetFov;
          }
          onComplete();
        }
      }

      animate();
    }

    // ---------- ANNOTATION SCALING ----------
    function updateAnnotationScale() {
      const container = document.getElementById("annotation-container");
      if (!container) return;
      const dw = projectData.designWidth || 0;
      const dh = projectData.designHeight || 0;
      const scaleOverride = projectData.annotationScaleOverride != null ? projectData.annotationScaleOverride : 100;
      if (dw > 0 && dh > 0) {
        const factor = Math.min(window.innerWidth / dw, window.innerHeight / dh);
        const overrideMultiplier = scaleOverride / 100;
        const adjusted = 1 + (factor - 1) * overrideMultiplier;
        const clamped = Math.min(3.0, Math.max(0.25, adjusted));
        // Match editor: container = viewport / scale, so after scale() it covers exactly the viewport
        container.style.width = (window.innerWidth / clamped) + "px";
        container.style.height = (window.innerHeight / clamped) + "px";
        container.style.transform = "scale(" + clamped + ")";
      } else {
        container.style.width = "100%";
        container.style.height = "100%";
        container.style.transform = "none";
      }
    }

    // ---------- CONSTRAINT POSITIONING HELPER ----------
    function getConstraintStyle(ann) {
      const position = ann.position || { x: 50, y: 50 };
      const cH = ann.constraintH || 'scale';
      const cV = ann.constraintV || 'scale';
      const offsetX = ann.anchorOffsetX ?? 0;
      const offsetY = ann.anchorOffsetY ?? 0;
      var css = '';
      var tX = '';
      var tY = '';

      switch (cH) {
        case 'left':
          css += 'left:' + offsetX + 'px;';
          tX = 'translateX(-50%)';
          break;
        case 'right':
          css += 'right:' + offsetX + 'px;';
          tX = 'translateX(50%)';
          break;
        default: // center, scale
          css += 'left:' + position.x + '%;';
          tX = 'translateX(-50%)';
          break;
      }
      switch (cV) {
        case 'top':
          css += 'top:' + offsetY + 'px;';
          tY = 'translateY(-50%)';
          break;
        case 'bottom':
          css += 'bottom:' + offsetY + 'px;';
          tY = 'translateY(50%)';
          break;
        default: // center, scale
          css += 'top:' + position.y + '%;';
          tY = 'translateY(-50%)';
          break;
      }
      return { css: css, tX: tX, tY: tY };
    }

    // ---------- GROUP (rigid-body position lock) ----------
    // Mirrors src/lib/annotationGroups.ts — keep both in sync.
    function getConstraintPixelPosition(ann, containerW, containerH) {
      const position = ann.position || { x: 50, y: 50 };
      const cH = ann.constraintH || 'scale';
      const cV = ann.constraintV || 'scale';
      var x, y;
      switch (cH) {
        case 'left':
          x = ann.anchorOffsetX != null ? ann.anchorOffsetX : 0;
          break;
        case 'right':
          x = containerW - (ann.anchorOffsetX != null ? ann.anchorOffsetX : 0);
          break;
        default: // center, scale
          x = (position.x / 100) * containerW;
          break;
      }
      switch (cV) {
        case 'top':
          y = ann.anchorOffsetY != null ? ann.anchorOffsetY : 0;
          break;
        case 'bottom':
          y = containerH - (ann.anchorOffsetY != null ? ann.anchorOffsetY : 0);
          break;
        default: // center, scale
          y = (position.y / 100) * containerH;
          break;
      }
      return { x: x, y: y };
    }

    function getAnnotationContainerSize() {
      const dw = projectData.designWidth || 0;
      const dh = projectData.designHeight || 0;
      const scaleOverride = projectData.annotationScaleOverride != null ? projectData.annotationScaleOverride : 100;
      if (dw > 0 && dh > 0) {
        const factor = Math.min(window.innerWidth / dw, window.innerHeight / dh);
        const overrideMultiplier = scaleOverride / 100;
        const adjusted = 1 + (factor - 1) * overrideMultiplier;
        const clamped = Math.min(3.0, Math.max(0.25, adjusted));
        return { w: window.innerWidth / clamped, h: window.innerHeight / clamped };
      }
      return { w: window.innerWidth, h: window.innerHeight };
    }

    // If ann is a non-primary group member, returns a shallow copy with its
    // position overridden to the primary's live position + the fixed px delta
    // captured at group time. Otherwise returns ann unchanged.
    function resolveGroupedAnnotation(ann, allAnnotations, containerW, containerH) {
      if (!ann.groupParentId) return ann;
      const primary = allAnnotations.find(function(a) {
        return a.id === ann.groupParentId && a.groupMemberIds && a.groupMemberIds.length;
      });
      if (!primary || !ann.groupOffset) return ann;
      const primaryPx = getConstraintPixelPosition(primary, containerW, containerH);
      const memberPx = { x: primaryPx.x + ann.groupOffset.x, y: primaryPx.y + ann.groupOffset.y };
      const pos = {
        x: containerW > 0 ? (memberPx.x / containerW) * 100 : 50,
        y: containerH > 0 ? (memberPx.y / containerH) * 100 : 50,
      };
      return Object.assign({}, ann, { position: pos, constraintH: 'scale', constraintV: 'scale' });
    }

    // ---------- ANNOTATIONS ----------
    function hideAllAnnotations() {
      const container = document.getElementById("annotation-container");
      container.innerHTML = "";
      hiddenAnnotationIds = new Set();
      const svgContainer = document.getElementById('connector-line-container');
      if (svgContainer) svgContainer.innerHTML = '';
    }
    
    // Animation helpers
    const CSS_EASING = {
      'linear': 'linear',
      'ease-in': 'ease-in',
      'ease-out': 'ease-out',
      'ease-in-out': 'ease-in-out',
      'ease-out-cubic': 'cubic-bezier(0.215, 0.61, 0.355, 1)',
      'bounce': 'cubic-bezier(0.68, -0.55, 0.265, 1.55)',
    };
    
    function getAnimationName(type, config) {
      switch (type) {
        case 'fade-in': return 'fadeInAnimation';
        case 'slide-in':
          const dir = config?.slideDirection || 'left';
          return 'slideInFrom' + dir.charAt(0).toUpperCase() + dir.slice(1);
        case 'flip':
          return 'flipAnimation' + (config?.flipAxis || 'Y');
        case 'zoom-in': return 'zoomInAnimation';
        case 'bounce': return 'bounceAnimation';
        default: return '';
      }
    }
    
    function calculateSequenceDelays(annotations) {
      let cumulativeDelay = 0;
      return annotations.map(ann => {
        const delay = cumulativeDelay;
        const anim = ann.animation;
        if (anim && anim.type !== 'none') {
          let duration = (anim.duration || 0.5) + (anim.delay || 0);
          if (anim.type === 'typewriter') {
            const twTarget = anim.typewriterTarget || 'all';
            // Only count the characters that will actually be typed
            let textLength = 0;
            if (twTarget === 'all') {
              textLength = (ann.title || '').length + (ann.text || '').length + (ann.buttonLabel || '').length;
            } else if (twTarget === 'title-only') {
              textLength = (ann.title || '').length;
            } else if (twTarget === 'body-only') {
              // Strip HTML tags for accurate character count
              const plainText = (ann.text || '').replace(/<[^>]*>/g, '');
              textLength = plainText.length;
            }
            // Add a small buffer for the fade-in of the non-typed part (0.3s)
            duration = textLength * ((anim.typewriterSpeed || 25) / 1000) + 0.3;
          }
          cumulativeDelay += duration;
        }
        return delay;
      });
    }
    
    function applyAnimation(element, ann, sequenceDelay, baseScale) {
      const anim = ann.animation;
      if (!anim || anim.type === 'none') return;

      if (anim.type === 'typewriter') {
        playTypewriterAnimation(element, ann, sequenceDelay);
      } else {
        const easing = CSS_EASING[anim.easing] || 'ease-out';
        const totalDelay = (anim.delay || 0) + sequenceDelay;
        const scale = baseScale || 1;

        // If we have a custom scale, generate dynamic keyframes for this element
        if (scale !== 1) {
          const uniqueAnimId = 'anim-' + (ann.id || '').replace(/[^a-zA-Z0-9]/g, '') + '-' + Date.now();
          const keyframes = generateScaledKeyframes(anim.type, anim, scale, uniqueAnimId);

          // Inject dynamic keyframes
          const styleEl = document.createElement('style');
          styleEl.textContent = keyframes;
          document.head.appendChild(styleEl);

          element.style.opacity = '0';
          element.style.animation = uniqueAnimId + ' ' + (anim.duration || 0.5) + 's ' + easing + ' ' + totalDelay + 's forwards';
        } else {
          // Use static keyframes for normal elements
          const animName = getAnimationName(anim.type, anim);
          element.style.opacity = '0';
          element.style.animation = animName + ' ' + (anim.duration || 0.5) + 's ' + easing + ' ' + totalDelay + 's forwards';
        }

        // Schedule exit animation after entry completes
        const entryEnd = totalDelay + (anim.duration || 0.5);
        scheduleExitAnimation(element, anim, entryEnd, scale);
      }
    }
    
    function generateScaledKeyframes(type, config, baseScale, animName) {
      const scale = function(value) { return baseScale * value; };
      const slideDistance = 100;
      
      switch (type) {
        case 'fade-in':
          return '@keyframes ' + animName + ' { from { opacity: 0; } to { opacity: 1; } }';
        
        case 'slide-in':
          const direction = config?.slideDirection || 'left';
          const transforms = {
            left: 'translateX(-' + slideDistance + 'px)',
            right: 'translateX(' + slideDistance + 'px)',
            top: 'translateY(-' + slideDistance + 'px)',
            bottom: 'translateY(' + slideDistance + 'px)',
          };
          return '@keyframes ' + animName + ' { ' +
            'from { opacity: 0; transform: translate(-50%, -50%) ' + transforms[direction] + ' scale(' + baseScale + '); } ' +
            'to { opacity: 1; transform: translate(-50%, -50%) scale(' + baseScale + '); } }';
        
        case 'flip':
          const axis = config?.flipAxis || 'Y';
          return '@keyframes ' + animName + ' { ' +
            'from { opacity: 0; transform: translate(-50%, -50%) rotate' + axis + '(90deg) scale(' + baseScale + '); } ' +
            'to { opacity: 1; transform: translate(-50%, -50%) rotate' + axis + '(0deg) scale(' + baseScale + '); } }';
        
        case 'zoom-in':
          return '@keyframes ' + animName + ' { ' +
            'from { opacity: 0; transform: translate(-50%, -50%) scale(0); } ' +
            'to { opacity: 1; transform: translate(-50%, -50%) scale(' + baseScale + '); } }';
        
        case 'bounce':
          return '@keyframes ' + animName + ' { ' +
            '0% { opacity: 0; transform: translate(-50%, -50%) scale(' + scale(0.3) + '); } ' +
            '50% { opacity: 0.8; transform: translate(-50%, -50%) scale(' + scale(1.05) + '); } ' +
            '70% { transform: translate(-50%, -50%) scale(' + scale(0.9) + '); } ' +
            '100% { opacity: 1; transform: translate(-50%, -50%) scale(' + baseScale + '); } }';
        
        default:
          return '';
      }
    }
    
    function getExitAnimName(type) {
      switch (type) {
        case 'fade-out': return 'fadeOutAnimation';
        case 'slide-out': return 'slideOutAnimation';
        case 'flip-out': return 'flipOutAnimation';
        case 'zoom-out': return 'zoomOutAnimation';
        case 'bounce-out': return 'bounceOutAnimation';
        default: return '';
      }
    }

    function generateExitKeyframes(type, config, baseScale) {
      const scale = baseScale || 1;
      const slideDistance = 100;
      const dir = config.exitSlideDirection || config.slideDirection || 'left';
      const axis = config.exitFlipAxis || config.flipAxis || 'Y';
      const transforms = {
        left: 'translateX(-' + slideDistance + 'px)',
        right: 'translateX(' + slideDistance + 'px)',
        top: 'translateY(-' + slideDistance + 'px)',
        bottom: 'translateY(' + slideDistance + 'px)',
      };

      switch (type) {
        case 'fade-out':
          return '@keyframes fadeOutAnimation { from { opacity: 1; } to { opacity: 0; } }';
        case 'slide-out':
          return '@keyframes slideOutAnimation { from { opacity: 1; transform: translate(-50%, -50%) scale(' + scale + '); } to { opacity: 0; transform: translate(-50%, -50%) ' + transforms[dir] + ' scale(' + scale + '); } }';
        case 'flip-out':
          return '@keyframes flipOutAnimation { from { opacity: 1; transform: translate(-50%, -50%) rotate' + axis + '(0deg) scale(' + scale + '); } to { opacity: 0; transform: translate(-50%, -50%) rotate' + axis + '(90deg) scale(' + scale + '); } }';
        case 'zoom-out':
          return '@keyframes zoomOutAnimation { from { opacity: 1; transform: translate(-50%, -50%) scale(' + scale + '); } to { opacity: 0; transform: translate(-50%, -50%) scale(0); } }';
        case 'bounce-out':
          return '@keyframes bounceOutAnimation { 0% { opacity: 1; transform: translate(-50%, -50%) scale(' + scale + '); } 30% { transform: translate(-50%, -50%) scale(' + (scale * 1.05) + '); } 50% { transform: translate(-50%, -50%) scale(' + (scale * 0.9) + '); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(0); } }';
        default:
          return '';
      }
    }

    function scheduleExitAnimation(element, anim, entryEndSeconds, baseScale) {
      if (!anim || !anim.exitEnabled || !anim.exitType || anim.exitType === 'none') return;
      const exitStart = entryEndSeconds + (anim.exitDisplayDuration != null ? anim.exitDisplayDuration : 2.0);
      const exitDur = anim.exitDuration || 0.5;
      const exitEasing = CSS_EASING[anim.exitEasing] || CSS_EASING[anim.easing] || 'ease-in';

      setTimeout(function() {
        // Inject exit keyframes
        const kf = generateExitKeyframes(anim.exitType, anim, baseScale || 1);
        if (kf) {
          const styleEl = document.createElement('style');
          styleEl.textContent = kf;
          document.head.appendChild(styleEl);
        }
        const animName = getExitAnimName(anim.exitType);
        element.style.opacity = '1';
        element.style.animation = animName + ' ' + exitDur + 's ' + exitEasing + ' 0s forwards';

        setTimeout(function() {
          element.style.opacity = '0';
          element.style.pointerEvents = 'none';
        }, exitDur * 1000);
      }, exitStart * 1000);
    }

    function playTypewriterAnimation(element, ann, startDelay) {
      const speed = ann.animation?.typewriterSpeed || 25;
      const target = ann.animation?.typewriterTarget || 'all';
      
      // Hide element completely until typewriter starts
      element.style.opacity = '0';
      
      // Immediately find and store text, then clear targets so nothing flashes
      const titleEl = element.querySelector('h3, .title-text');
      const textEl = element.querySelector('.text-content, span');
      
      const titleFullText = titleEl ? (titleEl.textContent || '') : '';
      const textFullText = textEl ? (textEl.textContent || '') : '';
      
      // Clear text content immediately to prevent flash
      if (target === 'all' || target === 'title-only') {
        if (titleEl) titleEl.textContent = '';
      }
      if (target === 'all' || target === 'body-only') {
        if (textEl && !titleEl) textEl.textContent = '';
      }
      
      const totalDelay = (startDelay + (ann.animation?.delay || 0)) * 1000;
      
      setTimeout(() => {
        // Now show the element and start typing
        element.style.opacity = '1';
        
        let typewriterChain = Promise.resolve();
        
        if (target === 'all' || target === 'title-only') {
          if (titleEl) {
            typewriterChain = typewriterChain.then(() => typeTextAsync(titleEl, titleFullText, speed));
          }
        }
        if (target === 'all' || target === 'body-only') {
          if (textEl && !titleEl) {
            typewriterChain = typewriterChain.then(() => typeTextAsync(textEl, textFullText, speed));
          }
        }
        // For 'title-only': fade in body after title finishes
        if (target === 'title-only' && textEl) {
          textEl.style.opacity = '0';
          textEl.style.transition = 'opacity 0.3s ease-out';
          typewriterChain = typewriterChain.then(() => {
            textEl.style.opacity = '1';
          });
        }
        // For 'body-only': fade in title immediately, then type body
        if (target === 'body-only' && titleEl && textEl) {
          // title shows immediately, body types
          typewriterChain = typewriterChain.then(() => typeTextAsync(textEl, textFullText, speed));
        }

        // Schedule exit animation after typewriter chain completes
        typewriterChain.then(function() {
          scheduleExitAnimation(element, ann.animation, 0, 1);
        });
      }, totalDelay);
    }
    
    function typeTextAsync(el, fullText, charSpeed) {
      return new Promise(function(resolve) {
        el.textContent = '';
        const cursor = document.createElement('span');
        cursor.className = 'typewriter-cursor';
        cursor.textContent = '';
        el.appendChild(cursor);
        
        let i = 0;
        const intervalMs = Math.max(1, charSpeed || 25);
        const interval = setInterval(() => {
          if (i < fullText.length) {
            el.insertBefore(document.createTextNode(fullText[i]), cursor);
            i++;
          } else {
            clearInterval(interval);
            setTimeout(() => cursor.remove(), 500);
            resolve();
          }
        }, intervalMs);
      });
    }
    
    // CSS scoping for custom buttons
    function scopeButtonCss(css, scopeId) {
      return css.replace(/\.([a-zA-Z_][\w-]*)/g, '.btn-' + scopeId + '-$1');
    }
    
    function scopeButtonHtml(html, scopeId) {
      return html.replace(/class="([^"]+)"/g, function(match, classes) {
        const scopedClasses = classes.split(/\s+/)
          .filter(Boolean)
          .map(function(c) { return 'btn-' + scopeId + '-' + c; })
          .join(' ');
        return 'class="' + scopedClasses + '"';
      });
    }
    
    function displayAnnotations(view) {
      if (!projectData.annotationEnabled) return;
      connectorLineViewStartTime = performance.now() / 1000;
      
      const container = document.getElementById("annotation-container");
      container.innerHTML = "";
      
      // Handle new annotations array
      const annotations = view.annotations || [];
      
      // Also handle legacy single annotation
      if (view.annotation && (view.annotation.text || view.annotation.title)) {
        annotations.push({
          ...view.annotation,
          type: 'text',
          id: 'legacy-annotation'
        });
      }
      
      // Calculate sequence delays
      const delays = calculateSequenceDelays(annotations);

      const groupContainerSize = getAnnotationContainerSize();

      annotations.forEach((rawAnn, idx) => {
        // Rigid-body group lock: non-primary members always render at the
        // primary's live position + their fixed px delta (Group Elements feature).
        const ann = resolveGroupedAnnotation(rawAnn, annotations, groupContainerSize.w, groupContainerSize.h);
        const type = ann.type || 'text';
        const sequenceDelay = delays[idx];

        // Skip buttons that are embedded into a text box
        if (type === 'button' && ann.parentTextId) return;

        switch (type) {
          case 'text':
            renderTextAnnotation(container, ann, idx, sequenceDelay, annotations);
            break;
          case 'title':
            renderTitleElement(container, ann, idx, sequenceDelay);
            break;
          case 'button':
            renderButtonElement(container, ann, idx, sequenceDelay);
            break;
          case 'image':
            renderImageElement(container, ann, idx, sequenceDelay);
            break;
        }
      });

      // Initialize icons
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    }
    
    function renderTextAnnotation(container, ann, idx, sequenceDelay, allAnnotations) {
      const brand = projectData.brandSettings || {};
      const titleSize = ann.titleSize || projectData.globalAnnotationTitleSize || 24;
      const titleColor = ann.titleColor || (brand.enabled ? brand.headingColor : null) || projectData.globalAnnotationTitleColor || "#ffffff";
      const titleFont = ann.titleFont || (brand.enabled ? brand.headingFontFamily : null) || projectData.globalAnnotationTitleFont || "Inter, sans-serif";
      const titleAlign = ann.titleAlign || "left";
      const textSize = ann.textSize || projectData.globalAnnotationTextSize || 16;
      const textColor = ann.textColor || (brand.enabled ? brand.titleColor : null) || projectData.globalAnnotationTextColor || "#ffffff";
      const textFont = ann.textFont || (brand.enabled ? brand.bodyFontFamily : null) || projectData.globalAnnotationTextFont || "Inter, sans-serif";
      const textAlign = ann.textAlign || "left";
      const transparency = (ann.transparency ?? projectData.annotationTransparency ?? 80) / 100;
      const outlineWidth = ann.outlineWidth ?? projectData.annotationOutlineWidth ?? 0;
      const outlineColor = ann.outlineColor || projectData.annotationOutlineColor || "#ffffff";
      const bgColor = ann.backgroundColor || projectData.annotationBackgroundColor || "#000000";
      const blur = ann.blur ?? projectData.annotationBlur ?? 0;
      const borderRadius = ann.borderRadius ?? projectData.annotationBorderRadius ?? 8;
      const shadow = ann.shadow ?? projectData.annotationShadow ?? 0;
      const shadowColor = ann.shadowColor || projectData.annotationShadowColor || "#000000";
      const paddingX = ann.paddingX ?? 16;
      const paddingY = ann.paddingY ?? 16;

      const position = ann.position || { x: 100, y: 100 };
      const width = Math.min(Math.max(ann.width || 800, 270), 1200);

      const hexToRgba = (hex, alpha) => {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      };

      const backgroundColor = hexToRgba(bgColor, transparency);
      const shadowAlpha = Math.min(0.1 + shadow * 0.01, 0.5);

      const fieldType = ann.fieldType || 'fixed';
      const annHeight = ann.height || 300;
      const isScrollable = fieldType === 'scrollable';

      const div = document.createElement('div');
      div.className = 'annotation-box visible' + (isScrollable ? ' scrollable-mode' : '');
      div.id = `annotation-${idx}`;
      if (ann.id) div.setAttribute('data-ann-id', ann.id);
      if (ann.boundToHotspotId) div.setAttribute('data-bound-hotspot-id', ann.boundToHotspotId);
      
      let heightStyle = '';
      if (isScrollable) {
        heightStyle = `height: ${annHeight}px; max-height: ${annHeight}px; display: flex; flex-direction: column; overflow: hidden;`;
      } else if (ann.height) {
        heightStyle = `height: ${ann.height}px; max-height: ${ann.height}px; overflow: hidden;`;
      }

      const cs = getConstraintStyle(ann);

      div.style.cssText = `
        ${cs.css}
        transform: ${cs.tX} ${cs.tY};
        width: min(${width}px, calc(100% - 48px));
        ${heightStyle}
        background: ${backgroundColor};
        ${outlineWidth > 0 ? `border: ${outlineWidth}px solid ${outlineColor};` : ""}
        ${blur > 0 ? `backdrop-filter: blur(${blur}px); -webkit-backdrop-filter: blur(${blur}px);` : ""}
        border-radius: ${borderRadius}px;
        padding: ${paddingY}px ${paddingX}px;
        ${shadow > 0 ? `box-shadow: 0 ${shadow * 0.5}px ${shadow}px ${shadowColor}${Math.round(shadowAlpha * 255).toString(16).padStart(2, '0')};` : ""}
      `;
      
      // Build embedded buttons as DOM elements (with hover/press/click)
      const embeddedButtonElements = [];
      const embeddedButtonIds = ann.embeddedButtonIds || [];
      if (embeddedButtonIds.length > 0 && allAnnotations) {
        const btnAlign = ann.embeddedButtonAlign || 'center';
        const justifyMap = { left: 'flex-start', center: 'center', right: 'flex-end' };
        embeddedButtonIds.forEach(btnId => {
          const btnAnn = allAnnotations.find(a => a.id === btnId);
          if (!btnAnn) return;
          const btnLabel = btnAnn.buttonLabel || 'Button';
          const btnPaddingX = btnAnn.buttonPaddingX ?? 24;
          const btnPaddingY = btnAnn.buttonPaddingY ?? 12;
          const btnBorderRadius = btnAnn.borderRadius ?? 8;
          const btnFont = btnAnn.buttonFont || 'Inter, sans-serif';
          const btnFontSize = btnAnn.buttonFontSize ?? 16;
          const btnIconName = btnAnn.buttonIcon;
          const btnIconPosition = btnAnn.buttonIconPosition || 'left';
          const btnShowLabel = btnIconPosition !== 'only';

          const defaultNormal = { bgColor: '#3b82f6', textColor: '#ffffff', borderWidth: 0, borderColor: '#2563eb', shadow: 4, shadowColor: '#000000', scale: 1 };
          const defaultHover = { bgColor: '#60a5fa', textColor: '#ffffff', borderWidth: 0, borderColor: '#3b82f6', shadow: 8, shadowColor: '#000000', scale: 1 };
          const defaultPressed = { bgColor: '#1d4ed8', textColor: '#ffffff', borderWidth: 0, borderColor: '#1e40af', shadow: 2, shadowColor: '#000000', scale: 0.95 };

            navigateToSceneById(action.targetSceneId, transitionDuration, action.targetSceneCameraId);

      thumb.style.cssText = 'position:absolute;top:50%;width:12px;height:12px;border-radius:9999px;background:' + lineColor + ';box-shadow:0 0 0 2px rgba(255,255,255,0.85);transform:translate(-6px,-50%);left:0%;';

      track.appendChild(thumb);

      var timeEl = document.createElement('span');
      timeEl.style.cssText = 'font-size:11px;color:rgba(255,255,255,0.8);white-space:nowrap;flex-shrink:0;display:' + (showTimeIndicator ? 'inline' : 'none') + ';';
      timeEl.textContent = '0:00 / 0:00';

      wrap.appendChild(playBtn);
      wrap.appendChild(track);
      wrap.appendChild(timeEl);

      var started = false;
      var isPlaying = false;

      function setPlayingIcon(p) {
        isPlaying = p;
        playBtn.innerHTML = p ? SOUND_ICON_PAUSE : SOUND_ICON_PLAY;
      }

      function startPlayback() {
        started = true;
        soundController.play({
          src: src,
          loop: loop,
          interruptBehavior: interruptBehavior,
          interruptFadeDuration: interruptFadeDuration,
          onTimeUpdate: function(t, d) {
            var ratio = d > 0 ? Math.min(1, t / d) : 0;
            trackFill.style.width = (ratio * 100) + '%';
            thumb.style.left = (ratio * 100) + '%';
            timeEl.textContent = formatSoundTime(t) + ' / ' + formatSoundTime(d);
          },
          onEnded: function() {
            setPlayingIcon(false);
            if (callbacks && callbacks.onEnded) callbacks.onEnded();
          },
          onStopped: function() {
            setPlayingIcon(false);
            if (callbacks && callbacks.onStopped) callbacks.onStopped();
          },
        });
        setPlayingIcon(true);
      }

      playBtn.onclick = function(e) {
        e.stopPropagation();
        if (!started) { startPlayback(); return; }
        if (isPlaying) { soundController.pause(); setPlayingIcon(false); }
        else { soundController.resume(); setPlayingIcon(true); }
      };

      var dragging = false;
      function seekFromClientX(clientX) {
        var rect = track.getBoundingClientRect();
        var ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        var active = soundController.getActive();
        var dur = (active && active.duration) || 0;
        if (dur > 0) {
          soundController.seek(ratio * dur);
          trackFill.style.width = (ratio * 100) + '%';
          thumb.style.left = (ratio * 100) + '%';
        }
      }
      track.addEventListener('pointerdown', function(e) {
        if (!showTimeline || !started) return;
        e.stopPropagation();
        dragging = true;
        try { track.setPointerCapture(e.pointerId); } catch (err) {}
        seekFromClientX(e.clientX);
      });
      track.addEventListener('pointermove', function(e) {
        if (!dragging) return;
        seekFromClientX(e.clientX);
      });
      track.addEventListener('pointerup', function() { dragging = false; });

      startPlayback();

      return wrap;
    }

    function executeGlbAnimation(elementId, clipName, mode) {
      const groups = glbAnimationGroups[elementId];
      if (!groups) return;
      const ag = groups.find((g) => g.name === clipName);
      if (!ag) return;
      groups.forEach((g) => { if (g !== ag) g.stop(); });
      if (mode === 'loop') {
        ag.start(true, 1.0);
      } else if (mode === 'play-once') {
        ag.onAnimationGroupEndObservable.addOnce(() => ag.stop());
        ag.start(false, 1.0);
      } else if (mode === 'toggle-stop') {
        if (ag.isPlaying) ag.stop();
        else ag.start(true, 1.0);
      }
    }

    // ---------- CROP VOLUME SUPPORT ----------

    // Sets up the per-draw onBind callback that feeds crop-volume shader uniforms every frame.
    function setupCropVolumeOnBind(mat) {
      if (!mat || mat._cropVolumeOnBindSet) return;
      mat._cropVolumeOnBindSet = true;
      mat.onBindObservable.add(function() {
        try {
          const effect = mat.getEffect();
          if (!effect) return;
          const cropPrims = collisionPrimitivesData.filter(function(p) {
            return (p.primitiveRole || 'collision') === 'crop-volume' && p.cropTargetElementId && p.visible !== false && p.type !== 'Plane';
          }).slice(0, 4);
          const cEnabled = new Float32Array(4);
          const cIsInside = new Float32Array(4);
          const cIsSphere = new Float32Array(4);
          const cShowOpp = new Float32Array(4);
          const cCenters = new Float32Array(12);
          const cRadii = new Float32Array(4);
          const cInvWorlds = new Float32Array(64);
          const cTargetParts = new Float32Array([- 1, -1, -1, -1]);
          for (let i = 0; i < 4; i++) {
            const cp = cropPrims[i];
            const cm = cp ? collisionPrimitiveMeshes.get(cp.id) : null;
            if (cp && cm) {
              const tProxy = loadedElementParts[cp.cropTargetElementId];
              if (tProxy !== undefined) {
                const tpi = typeof tProxy.partIndex === 'number' ? tProxy.partIndex : -1;
                cTargetParts[i] = tpi;
                cEnabled[i] = 1;
                cIsInside[i] = cp.cropMode !== 'outside' ? 1 : 0;
                cIsSphere[i] = cp.type === 'Sphere' ? 1 : 0;
                cShowOpp[i] = cp.cropShowOpposite ? 1 : 0;
                if (cp.type === 'Sphere') {
                  const c = cm.getAbsolutePosition();
                  cCenters[i * 3] = c.x; cCenters[i * 3 + 1] = c.y; cCenters[i * 3 + 2] = c.z;
                  cRadii[i] = Math.max(cm.scaling.x, cm.scaling.y, cm.scaling.z) * 0.5;
                }
                BABYLON.Matrix.Invert(cm.getWorldMatrix()).copyToArray(cInvWorlds, i * 16);
              } else {
                BABYLON.Matrix.Identity().copyToArray(cInvWorlds, i * 16);
              }
            } else {
              BABYLON.Matrix.Identity().copyToArray(cInvWorlds, i * 16);
            }
          }
          effect.setFloatArray('uCropEnabled', cEnabled);
          effect.setFloatArray('uCropIsInside', cIsInside);
          effect.setFloatArray('uCropIsSphere', cIsSphere);
          effect.setFloatArray('uCropShowOpposite', cShowOpp);
          effect.setFloatArray3('uCropCenter', cCenters);
          effect.setFloatArray('uCropRadius', cRadii);
          effect.setMatrices('uCropInvWorld', cInvWorlds);
          effect.setFloatArray('uCropTargetPart', cTargetParts);
        } catch (e) { /* uniforms not ready yet */ }
      });
    }

    function executeCropVolumeScale(cropVolumeId, direction, duration) {
      const mesh = collisionPrimitiveMeshes.get(cropVolumeId);
      const primitive = collisionPrimitivesData.find(function(p) { return p.id === cropVolumeId; });
      if (!mesh || !primitive || !scene) return;

      const sc = primitive.transform && primitive.transform.scale ? primitive.transform.scale : [1, 1, 1];
      const authored = new BABYLON.Vector3(sc[0], sc[1], sc[2]);
      const nearZero = new BABYLON.Vector3(0.001, 0.001, 0.001);

      let resolvedDirection = direction;
      if (direction === 'toggle') {
        const authoredAvg = (sc[0] + sc[1] + sc[2]) / 3;
        const currentAvg = (mesh.scaling.x + mesh.scaling.y + mesh.scaling.z) / 3;
        resolvedDirection = currentAvg < authoredAvg * 0.5 ? 'reveal' : 'hide';
      }

      const from = resolvedDirection === 'reveal' ? nearZero : authored;
      const to = resolvedDirection === 'reveal' ? authored : nearZero;
      mesh.scaling.copyFrom(from);

      const fps = 60;
      const frames = Math.max(1, Math.round(duration * fps));

      function makeAnim(prop, fromVal, toVal) {
        const anim = new BABYLON.Animation(
          'cropVolumeScale_' + cropVolumeId + '_' + prop,
          'scaling.' + prop,
          fps,
          BABYLON.Animation.ANIMATIONTYPE_FLOAT,
          BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT,
        );
        anim.setKeys([{ frame: 0, value: fromVal }, { frame: frames, value: toVal }]);
        const ease = new BABYLON.CubicEase();
        ease.setEasingMode(BABYLON.EasingFunction.EASINGMODE_EASEINOUT);
        anim.setEasingFunction(ease);
        return anim;
      }

      scene.beginDirectAnimation(
        mesh,
        [makeAnim('x', from.x, to.x), makeAnim('y', from.y, to.y), makeAnim('z', from.z, to.z)],
        0, frames, false, 1.0,
      );
    }

    function executeCropVolumeSnapshot(primitiveId, mode, snapshotId, duration) {
      const mesh = collisionPrimitiveMeshes.get(primitiveId);
      const primitive = collisionPrimitivesData.find(function(p) { return p.id === primitiveId; });
      if (!mesh || !primitive || !scene) return;

      var snapshots = primitive.transformSnapshots || [];
      if (snapshots.length === 0) return;

      var targetSnapshot;
      if (mode === 'specific') {
        targetSnapshot = snapshots.find(function(s) { return s.id === snapshotId; });
      } else {
        var currentIndex = cropVolumeSnapshotIndex[primitiveId] !== undefined ? cropVolumeSnapshotIndex[primitiveId] : -1;
        var nextIndex = (currentIndex + 1) % snapshots.length;
        cropVolumeSnapshotIndex[primitiveId] = nextIndex;
        targetSnapshot = snapshots[nextIndex];
      }
      if (!targetSnapshot) return;

      // rotationQuaternion overrides rotation.x/y/z — read current euler from it and clear it
      var fromRotX = mesh.rotation.x;
      var fromRotY = mesh.rotation.y;
      var fromRotZ = mesh.rotation.z;
      if (mesh.rotationQuaternion) {
        var euler = mesh.rotationQuaternion.toEulerAngles();
        fromRotX = euler.x;
        fromRotY = euler.y;
        fromRotZ = euler.z;
        mesh.rotationQuaternion = null;
      }
      mesh.rotation.set(fromRotX, fromRotY, fromRotZ);

      var fps = 60;
      var frames = Math.max(1, Math.round(duration * fps));

      function makeAnim(prop, fromVal, toVal) {
        var anim = new BABYLON.Animation(
          'cropSnap_' + primitiveId + '_' + prop,
          prop, fps,
          BABYLON.Animation.ANIMATIONTYPE_FLOAT,
          BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT,
        );
        anim.setKeys([{ frame: 0, value: fromVal }, { frame: frames, value: toVal }]);
        var ease = new BABYLON.CubicEase();
        ease.setEasingMode(BABYLON.EasingFunction.EASINGMODE_EASEINOUT);
        anim.setEasingFunction(ease);
        return anim;
      }

      scene.beginDirectAnimation(mesh, [
        makeAnim('position.x', mesh.position.x, targetSnapshot.position[0]),
        makeAnim('position.y', mesh.position.y, targetSnapshot.position[1]),
        makeAnim('position.z', mesh.position.z, targetSnapshot.position[2]),
        makeAnim('rotation.x', fromRotX, targetSnapshot.rotation[0]),
        makeAnim('rotation.y', fromRotY, targetSnapshot.rotation[1]),
        makeAnim('rotation.z', fromRotZ, targetSnapshot.rotation[2]),
        makeAnim('scaling.x', mesh.scaling.x, targetSnapshot.scale[0]),
        makeAnim('scaling.y', mesh.scaling.y, targetSnapshot.scale[1]),
        makeAnim('scaling.z', mesh.scaling.z, targetSnapshot.scale[2]),
      ], 0, frames, false, 1.0);
    }

    function executeGlbPlayAllOnce(elementId) {
      const groups = glbAnimationGroups[elementId];
      if (!groups || groups.length === 0) return;
      glbLoopAllActive[elementId] = false;
      groups.forEach((g) => g.stop());
      let idx = 0;
      function playNext() {
        if (idx >= groups.length) return;
        const ag = groups[idx++];
        groups.forEach((g) => { if (g !== ag) g.stop(); });
        ag.onAnimationGroupEndObservable.addOnce(playNext);
        ag.start(false, 1.0);
      }
      playNext();
    }

    function triggerCameraActivatedGlbAnimations(viewId) {
      if (!viewId) return;
      const scene = getCurrentScene();
      if (!scene || !scene.threeDElements) return;
      scene.threeDElements.forEach((el) => {
        if (el.animationActivateOnCamera !== viewId) return;
        const groups = glbAnimationGroups[el.id];
        if (!groups || groups.length === 0) return;
        if (el.animationPlayAllOnce && groups.length > 1) {
          executeGlbPlayAllOnce(el.id);
        } else {
          const clip = el.activeAnimationClip || groups[0]?.name;
          if (clip) executeGlbAnimation(el.id, clip, 'play-once');
        }
      });
    }
