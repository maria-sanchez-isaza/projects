<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Upload</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
      line-height: 1.6;
    }

    .upload-area {
      margin-top: 30px;
      padding: 30px;
      border: 2px dashed #aaa;
      border-radius: 10px;
    }

    input[type="file"] {
      margin-top: 15px;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #444;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Welcome</h1>

    <p>
      This page is a place to test and share project files.      
    </p>

   

</body>
</html>
