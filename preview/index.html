<header><h1>Tosolini Productions · Desktop 3D review</h1><button id="intro" disabled>Replay intro</button><button id="idle" disabled>Idle loop</button><button id="pause" disabled>Pause</button><button id="reset" disabled>Reset camera</button></header><div id="view"></div><footer><span id="status">Loading animated showroom…</span><span>Drag to orbit · Scroll to inspect</span></footer>

const view=document.querySelector('#view'),status=document.querySelector('#status');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setClearColor(0xe5e1da);renderer.toneMapping=THREE.AgXToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;view.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe6f2ff,0xbda58b,1.2));

const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
try{
 const gltf=await loader.loadAsync(new URLSearchParams(location.search).has('raw')?'../showroom.raw.glb':'../Tosolini_Showroom_Desktop.glb');scene.add(gltf.scene);gltf.scene.updateMatrixWorld(true);
 gltf.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;/* Source scan and hologram alpha are kept. */}});
 const original=gltf.cameras[0];if(!original)throw Error('Missing overview camera');camera=original.clone();original.matrixWorld.decompose(camera.position,camera.quaternion,camera.scale);camera.updateMatrixWorld();initialCamera=camera.clone();
 controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const direction=camera.getWorldDirection(new THREE.Vector3());controls.target.copy(camera.position).addScaledVector(direction,30);controls.update();controls.saveState();
 mixer=new THREE.AnimationMixer(gltf.scene);actions=Object.fromEntries(gltf.animations.map(c=>[c.name,mixer.clipAction(c)]));mixer.addEventListener('finished',e=>{if(!paused&&e.action===actions.Intro)play('Idle_Loop')});
 document.querySelectorAll('button').forEach(b=>b.disabled=false);document.querySelector('#intro').onclick=()=>play('Intro');document.querySelector('#idle').onclick=()=>play('Idle_Loop');document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Resume':'Pause'};document.querySelector('#reset').onclick=()=>controls.reset();
 window.review={gltf,scene,renderer,get camera(){return camera},get active(){return active},play,seek(name,time){play(name);paused=true;mixer.update(time);scene.updateMatrixWorld(true);return {name,time}},stats(){return {clips:gltf.animations.map(c=>({name:c.name,duration:c.duration,tracks:c.tracks.length})),drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,meshes:gltf.scene.getObjectsByProperty('isMesh',true).length}},snapshot(){scene.updateMatrixWorld(true);return gltf.scene.getObjectsByProperty('isMesh',true).map(o=>({name:o.name,matrix:o.matrixWorld.toArray(),weights:o.morphTargetInfluences||[],bones:o.skeleton?Array.from(o.skeleton.boneMatrices):[]}))}};
 play('Intro');resize();
}catch(e){status.textContent='Could not load model: '+e.message;console.error(e)}
renderer.setAnimationLoop(()=>{timer.update();const dt=Math.min(timer.getDelta(),.05);if(mixer&&!paused)mixer.update(dt);if(controls)controls.update();if(camera){renderer.render(scene,camera);status.textContent=`${active} · ${actions[active].time.toFixed(1)} s · ${paused?'Paused':'Playing'}`}});
